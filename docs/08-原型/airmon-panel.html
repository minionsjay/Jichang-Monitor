<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机场监控 · 侧边栏面板</title>
<style>
/* ============================================================
   机场监控侧边栏面板 —— DSW 主题 token 版
   规则：所有颜色经 var(--dsw-*, 回退值) 声明。
   在 DSW 内吃真实 token；双击独立打开时吃 neutral-bluish 回退值。
   禁止渐变；主按钮=黑 #0f1115 / hover #43454a；业务蓝 #4176e6 仅作强调。
   ============================================================ */
:root{
  --font: -apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  --bg:        var(--dsw-alias-bg-base, #ffffff);
  --layer1:    var(--dsw-alias-bg-layer-1, #f9fafb);
  --layer2:    var(--dsw-alias-bg-layer-2, #f1f3f5);
  --border:    var(--dsw-alias-border-l1, #ebeef2);
  --tx:        var(--dsw-alias-label-primary, #0f1115);
  --tx-2:      var(--dsw-alias-label-secondary, #61666b);
  --tx-3:      var(--dsw-alias-label-tertiary, #81858c);
  --brand:     var(--dsw-alias-brand-primary, #4176e6);
  --btn:       var(--dsw-alias-button-primary-fill, #0f1115);
  --btn-hover: var(--dsw-alias-button-primary-hover, #43454a);
  --ok:        var(--dsw-alias-state-success-primary, #178a50);
  --warn:      var(--dsw-alias-state-warn-primary, #b7791f);
  --err:       var(--dsw-alias-state-error-primary, #d64545);
  --ring:      var(--dsw-focus-ring-color, #4176e6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:13px/1.5 var(--font);
  -webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;min-height:100vh}

/* ---------- 头部 ---------- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:var(--bg);z-index:5}
.hd-t{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;min-width:0}
.hd-t .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}
.btn{appearance:none;border:0;border-radius:7px;padding:5px 14px;font-size:12px;
  font-weight:500;cursor:pointer;font-family:inherit;color:#fff;background:var(--btn);
  transition:background .15s}
.btn:hover{background:var(--btn-hover)}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:default}

/* ---------- KPI 条 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;
  padding:10px 12px 4px}
.kpi{background:var(--layer1);border:1px solid var(--border);border-radius:8px;
  padding:6px 9px;min-width:0}
.kpi b{display:block;font-size:16px;line-height:1.25;font-weight:600}
.kpi small{display:block;color:var(--tx-3);font-size:11px}
.kpi.warn b{color:var(--warn)}.kpi.err b{color:var(--err)}.kpi.acc b{color:var(--brand)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--border);
  position:sticky;top:41px;background:var(--bg);z-index:4}
.tab{appearance:none;border:0;background:none;cursor:pointer;font:inherit;font-size:12.5px;
  color:var(--tx-3);padding:5px 9px 7px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--tx-2)}
.tab.on{color:var(--tx);border-bottom-color:var(--brand);font-weight:600}
.tab:focus-visible{outline:2px solid var(--ring);outline-offset:-2px;border-radius:4px}
.tab .n{font-size:11px;color:var(--tx-3);margin-left:3px}
main{flex:1;padding:10px 12px 16px}
section[hidden]{display:none}

/* ---------- 工具条 ---------- */
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.search{flex:1;min-width:120px;border:1px solid var(--border);border-radius:7px;
  padding:5px 9px;font:12px var(--font);color:var(--tx);background:var(--layer1)}
.search:focus{outline:2px solid var(--ring);outline-offset:-1px;background:var(--bg)}
select{border:1px solid var(--border);border-radius:7px;padding:5px 6px;font:12px var(--font);
  color:var(--tx);background:var(--layer1)}
.chipbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.fchip{appearance:none;border:1px solid var(--border);background:var(--layer1);
  border-radius:999px;padding:2px 10px;font:11.5px var(--font);color:var(--tx-2);cursor:pointer}
.fchip:hover{color:var(--tx)}
.fchip.on{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:500}

/* ---------- 卡片网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:8px}
.card{border:1px solid var(--border);border-left:3px solid var(--ok);border-radius:9px;
  background:var(--bg);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.st-warn{border-left-color:var(--warn)}
.card.st-err{border-left-color:var(--err)}
.card:hover{border-color:var(--brand);border-left-color:var(--brand)}
.c-h{display:flex;align-items:center;gap:6px;min-width:0}
.c-slug{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-badge{margin-left:auto;flex:none;font-size:11px;color:var(--tx-2);background:var(--layer2);
  border-radius:5px;padding:1px 6px}
.c-meta{font-size:11px;color:var(--tx-3);display:flex;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;border:1px solid var(--border);color:var(--tx-2);border-radius:999px;
  padding:0 7px;line-height:17px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.up{color:var(--ok);border-color:var(--ok)}
.tag.dn{color:var(--err);border-color:var(--err)}
.tag.wn{color:var(--warn);border-color:var(--warn)}
.tag.er{color:var(--err);border-color:var(--err)}
.tag.acc{color:var(--brand);border-color:var(--brand)}
.bar{height:4px;border-radius:2px;background:var(--layer2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:2px}
.bar i.w{background:var(--warn)}.bar i.e{background:var(--err)}
.u-row{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx-3)}

/* ---------- 列表区（到期/告警/华为/运行） ---------- */
.panel-box{border:1px solid var(--border);border-radius:9px;background:var(--bg);
  margin-bottom:10px;overflow:hidden}
.pb-h{padding:7px 11px;font-size:12px;font-weight:600;color:var(--tx-2);
  background:var(--layer1);border-bottom:1px solid var(--border)}
.pb-b{padding:8px 11px}
.row{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border);
  font-size:12px;min-width:0}
.row:last-child{border-bottom:0}
.row .k{flex:none;font-weight:600;min-width:74px}
.row .v{color:var(--tx-2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .r{margin-left:auto;flex:none}
.exp-table{width:100%;border-collapse:collapse;font-size:12px}
.exp-table th{color:var(--tx-3);font-weight:500;text-align:left;padding:3px 6px;
  border-bottom:1px solid var(--border);font-size:11px;white-space:nowrap}
.exp-table td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.exp-table tr:last-child td{border-bottom:0}
.exp-table .num{text-align:right;white-space:nowrap}
.mini-bar{width:64px;height:4px;border-radius:2px;background:var(--layer2);position:relative;
  display:inline-block;vertical-align:middle;margin-right:6px;overflow:hidden}
.mini-bar i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:2px}
.mini-bar i.w{background:var(--warn)}.mini-bar i.e{background:var(--err)}
.muted{color:var(--tx-3)}
.note{font-size:11px;color:var(--tx-3);background:var(--layer1);border:1px dashed var(--border);
  border-radius:8px;padding:7px 10px;margin-top:8px}
.banner{font-size:11.5px;border:1px solid var(--warn);color:var(--warn);border-radius:8px;
  padding:6px 10px;margin-bottom:10px}
.empty{color:var(--tx-3);font-size:12px;padding:14px 0;text-align:center}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--border);padding:7px 12px;font-size:10.5px;color:var(--tx-3);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.src{border:1px solid var(--border);border-radius:999px;padding:0 8px;line-height:16px}
.src.live{color:var(--ok);border-color:var(--ok)}
.src.snap{color:var(--warn);border-color:var(--warn)}
</style>
</head>
<body>
<div id="app">
  <header class="hd">
    <div class="hd-t"><span class="dot" id="hd-dot"></span><span class="name">机场监控</span>
      <span class="muted" style="font-weight:400;font-size:11px" id="hd-base"></span></div>
    <button class="btn" id="refresh">刷新</button>
  </header>

  <div class="kpis" id="kpis"></div>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="ov">总览</button>
    <button class="tab" data-tab="ex">到期<span class="n" id="n-ex"></span></button>
    <button class="tab" data-tab="al">告警<span class="n" id="n-al"></span></button>
    <button class="tab" data-tab="hw">华为<span class="n" id="n-hw"></span></button>
    <button class="tab" data-tab="rn">运行</button>
  </nav>

  <main>
    <section id="tab-ov">
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="搜索机场 slug…">
        <select id="sort">
          <option value="def">默认排序</option>
          <option value="nodes">按节点数</option>
          <option value="expire">按到期</option>
          <option value="usage">按用量</option>
        </select>
      </div>
      <div class="chipbar" id="filters">
        <button class="fchip on" data-f="all">全部</button>
        <button class="fchip" data-f="delta">有变更</button>
        <button class="fchip" data-f="zero">0 拉取</button>
        <button class="fchip" data-f="expiring">临期/过期</button>
        <button class="fchip" data-f="hw">华为命中</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="grid-empty" hidden>没有符合条件的机场</div>
    </section>

    <section id="tab-ex" hidden>
      <div class="panel-box"><div class="pb-h">套餐到期（按剩余天数升序）</div>
        <div class="pb-b" style="padding:2px 6px"><table class="exp-table" id="exp-t"></table></div></div>
      <div class="note">天数取自 quota.days_left；「长期」表示未登记到期日。红色 = 已过期，黄 = 30 天内。</div>
    </section>

    <section id="tab-al" hidden>
      <div class="panel-box"><div class="pb-h">告警流（最近在前）</div><div class="pb-b" id="al-list"></div></div>
    </section>

    <section id="tab-hw" hidden>
      <div class="panel-box"><div class="pb-h">当前命中</div><div class="pb-b" id="hw-cur"></div></div>
      <div class="panel-box"><div class="pb-h">命中台账（历史累计）</div><div class="pb-b" id="hw-ledger"></div></div>
      <div class="note">华为命中区：按 RDAP/ASN 规则识别落在华为云的节点。evidence 为公开注册组织名，不含端点。</div>
    </section>

    <section id="tab-rn" hidden>
      <div id="rn-inflight"></div>
      <div class="panel-box"><div class="pb-h">最近一轮运行</div><div class="pb-b" id="rn-box"></div></div>
    </section>
  </main>

  <footer>
    <span id="ft-gen"></span>
    <span class="src" id="ft-src">…</span>
    <span>白名单脱敏数据</span>
  </footer>
</div>

<script>
'use strict';
/* ================= 数据装载 =================
   优先级：内嵌快照（立即渲染）→ postMessage 桥（插件模式，parent 代取
   /airmon-sidebar/api/data 实时过滤结果）→ fetch('./data.json')（http 静态托管模式）。 */
const EMBED = JSON.parse(document.getElementById('airmon-data').textContent);
let DATA = EMBED, SRC = 'embedded';

function loadData(fast) {
  if (!fast) paint(DATA, SRC);                       // 先按现有数据重绘（按钮反馈）
  let settled = false;
  const reqId = 'r' + Date.now();
  const onMsg = (e) => {
    const d = e.data;
    if (!d || d.type !== 'airmon:data' || d.id !== reqId || !d.payload) return;
    if (e.source !== window.parent) return;      // 只接受父窗口的应答
    settled = true; window.removeEventListener('message', onMsg);
    DATA = d.payload; SRC = 'live'; paint(DATA, SRC);
  };
  window.addEventListener('message', onMsg);
  try { window.parent.postMessage({ type: 'airmon:get', id: reqId }, '*'); } catch (_) {}
  setTimeout(() => {
    window.removeEventListener('message', onMsg);
    if (settled) return;
    if (location.protocol.indexOf('http') === 0) {
      fetch('data.json', { cache: 'no-cache' })
        .then(r => r.ok ? r.json() : null)
        .then(j => { if (j) { DATA = j; SRC = 'fetch'; paint(DATA, SRC); } })
        .catch(() => {});
    }
  }, 1100);
}
document.getElementById('refresh').addEventListener('click', () => loadData(false));
setInterval(() => { if (SRC === 'live') loadData(false); }, 10 * 60 * 1000);

/* ================= 渲染 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = { tab: 'ov', q: '', f: 'all', sort: 'def' };

function daysChip(a) {
  const q = a.quota; if (!q) return '';
  if (q.unlimited) return '<span class="tag">不限量</span>';
  const d = q.days_left;
  if (d == null) return '<span class="tag">长期</span>';
  if (d < 0) return `<span class="tag er">已过期 ${-d} 天</span>`;
  if (d <= 30) return `<span class="tag wn">${d} 天到期</span>`;
  return `<span class="tag">${d} 天</span>`;
}
function usageHtml(a) {
  const q = a.quota; if (!q || q.used_pct == null || q.total_gb == null) return '';
  const p = Math.max(0, Math.min(100, q.used_pct));
  const cls = p > 90 ? 'e' : (p > 70 ? 'w' : '');
  const used = q.used_gb == null ? '—' : (+q.used_gb).toFixed(1);
  const tot = q.unlimited ? '∞' : (+q.total_gb).toFixed(0);
  return `<div class="u-row"><span>用量 ${esc(used)}/${esc(tot)} GB</span><span>${p.toFixed(1)}%</span></div>
    <div class="bar"><i class="${cls}" style="width:${p}%"></i></div>`;
}
function cardHtml(a) {
  const st = a.status === 'ok' ? '' : (a.status === 'stale' ? 'st-err' : 'st-warn');
  const tags = [];
  if (a.added_n > 0) tags.push(`<span class="tag up">+${a.added_n}</span>`);
  if (a.removed_n > 0) tags.push(`<span class="tag dn">−${a.removed_n}</span>`);
  if (a.pull_zero) tags.push('<span class="tag wn">0 拉取</span>');
  if (a.status === 'stale') tags.push('<span class="tag er">数据滞后</span>');
  if (a.hit_n > 0) tags.push(`<span class="tag acc">华为×${a.hit_n}</span>`);
  (a.proto_top || []).slice(0, 3).forEach(p =>
    tags.push(`<span class="tag" title="协议">${esc(p[0])} ${p[1]}</span>`));
  (a.geo_top || []).slice(0, 3).forEach(g =>
    tags.push(`<span class="tag" title="地区">${esc(g[0])} ${g[1]}</span>`));
  tags.push(daysChip(a));
  const age = a.age_h == null ? '' : (a.age_h < 1 ? `${Math.round(a.age_h * 60)} 分钟前` : `${(+a.age_h).toFixed(1)} 小时前`);
  return `<div class="card ${st}">
    <div class="c-h"><span class="c-slug">${esc(a.slug)}</span>
      <span class="c-badge">${a.nodes} 节点</span></div>
    <div class="c-meta"><span>更新 ${esc(a.latest_local || '—')}</span><span>${esc(age)}</span></div>
    ${usageHtml(a)}
    <div class="tags">${tags.join('')}</div></div>`;
}
function paintKpi(d) {
  const t = d.totals || {};
  const k = [
    ['机场', t.airports, ''],
    ['节点', t.nodes, ''],
    ['0 拉取', (t.zero_pull || []).length, (t.zero_pull || []).length ? 'warn' : ''],
    ['已过期', (t.expired || []).length, (t.expired || []).length ? 'err' : ''],
    ['30 天内到期', (t.expiring30 || []).length, (t.expiring30 || []).length ? 'warn' : ''],
    ['华为命中', t.hits, t.hits ? 'err' : ''],
    ['数据滞后', (t.stale || []).length, (t.stale || []).length ? 'err' : ''],
  ];
  $('kpis').innerHTML = k.map(x =>
    `<div class="kpi ${x[2]}"><b>${x[1] == null ? '—' : x[1]}</b><small>${x[0]}</small></div>`).join('');
}
function paintOverview(d) {
  let list = (d.airports || []).slice();
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter(a => a.slug.toLowerCase().includes(q));
  const t = d.totals || {};
  const inSet = (s, arr) => (arr || []).includes(s);
  if (state.f === 'delta') list = list.filter(a => a.added_n > 0 || a.removed_n > 0);
  if (state.f === 'zero') list = list.filter(a => a.pull_zero || inSet(a.slug, t.zero_pull));
  if (state.f === 'expiring') list = list.filter(a =>
    a.quota && a.quota.days_left != null && a.quota.days_left <= 30);
  if (state.f === 'hw') list = list.filter(a => a.hit_n > 0);
  if (state.sort === 'nodes') list.sort((a, b) => b.nodes - a.nodes);
  if (state.sort === 'expire') list.sort((a, b) =>
    (a.quota && a.quota.days_left != null ? a.quota.days_left : 1e9) -
    (b.quota && b.quota.days_left != null ? b.quota.days_left : 1e9));
  if (state.sort === 'usage') list.sort((a, b) =>
    ((b.quota && b.quota.used_pct) || 0) - ((a.quota && a.quota.used_pct) || 0));
  $('grid').innerHTML = list.map(cardHtml).join('');
  $('grid-empty').hidden = list.length > 0;
}
function paintExpire(d) {
  const rows = (d.airports || []).filter(a => a.quota).sort((a, b) =>
    (a.quota.days_left == null ? 1e9 : a.quota.days_left) -
    (b.quota.days_left == null ? 1e9 : b.quota.days_left));
  const cell = a => {
    const q = a.quota, d = q.days_left;
    let badge = '<span class="muted">长期</span>';
    if (q.unlimited) badge = '<span class="muted">不限量</span>';
    else if (d != null && d < 0) badge = `<span class="tag er">过期 ${-d} 天</span>`;
    else if (d != null && d <= 30) badge = `<span class="tag wn">${d} 天</span>`;
    else if (d != null) badge = `<span class="muted">${d} 天</span>`;
    const p = Math.max(0, Math.min(100, q.used_pct || 0));
    const cls = p > 90 ? 'e' : (p > 70 ? 'w' : '');
    return `<tr><td style="font-weight:600">${esc(a.slug)}</td>
      <td class="muted">${esc(q.expire_date || '—')}</td><td>${badge}</td>
      <td class="num"><span class="mini-bar"><i class="${cls}" style="width:${p}%"></i></span><span class="muted">${p.toFixed(0)}%</span></td>
      <td class="num muted">${(+q.used_gb || 0).toFixed(1)} / ${q.unlimited ? '∞' : (+q.total_gb || 0).toFixed(0)} GB</td></tr>`;
  };
  $('exp-t').innerHTML = '<tr><th>机场</th><th>到期日</th><th>剩余</th><th>用量</th><th>已用/总量</th></tr>'
    + rows.map(cell).join('');
  $('n-ex').textContent = rows.length ? String(rows.length) : '';
}
function paintAlerts(d) {
  const list = (d.alerts || []).slice(0, 60);
  $('al-list').innerHTML = list.length ? list.map(a =>
    `<div class="row"><span class="k">${esc(a.ts_local || '')}</span>
     <span class="v" style="font-weight:600;color:var(--tx)">${esc(a.airport)}</span>
     ${a.added_n ? `<span class="tag up">+${a.added_n}</span>` : ''}
     ${a.removed_n ? `<span class="tag dn">−${a.removed_n}</span>` : ''}
     ${a.hw_n ? `<span class="tag acc">华为×${a.hw_n}</span>` : ''}
     <span class="r muted">HW ${a.hw_n || 0}</span></div>`).join('')
    : '<div class="empty">暂无告警</div>';
  $('n-al').textContent = (d.alerts || []).length ? String(d.alerts.length) : '';
}
function paintHw(d) {
  const cur = d.hw_current || [];
  $('hw-cur').innerHTML = cur.length ? cur.map(f =>
    `<div class="row"><span class="k">${esc(f.airport)}</span>
     <span class="v">${esc(f.rule || '')}</span><span class="r muted">×${f.count || 1}</span></div>`).join('')
    : '<div class="empty">当前无命中 ✓</div>';
  const led = d.hw_ledger || [];
  $('hw-ledger').innerHTML = led.length ? led.map(h =>
    `<div class="row"><span class="k">${esc(h.airport)}</span>
     <span class="v">${esc(h.rule)}<br><span class="muted" style="font-size:11px">${esc(h.evidence || '')}</span></span>
     <span class="r muted">×${h.count} · ${esc(h.last_ts_local || '')}</span></div>`).join('')
    : '<div class="empty">台账为空</div>';
  $('n-hw').textContent = (led.length || cur.length) ? String(led.length) : '';
}
function paintRun(d) {
  const r = d.runlog || {};
  $('rn-inflight').innerHTML = r.inflight
    ? '<div class="banner">新一轮检测进行中或上次未正常收尾（见 runlog.note）</div>' : '';
  const chip = (arr, cls) => (arr || []).map(s => `<span class="tag ${cls || ''}">${esc(s)}</span>`).join('') || '<span class="muted">无</span>';
  $('rn-box').innerHTML = `
    <div class="row"><span class="k">时间</span><span class="v">${esc(r.start_local || '—')} → ${esc(r.done_local || '—')}（${r.duration_min == null ? '—' : (+r.duration_min).toFixed(1)} 分钟）</span></div>
    <div class="row"><span class="k">规模</span><span class="v">机场 ${r.final_aps ?? '—'} · 节点 ${r.final_nodes ?? '—'}</span></div>
    <div class="row"><span class="k">成功</span><span class="v">${r.ok_n ?? '—'} 个源 · ${r.ok_nodes ?? '—'} 节点</span></div>
    <div class="row"><span class="k">0 拉取</span><span class="v tags">${chip(r.zero, 'wn')}</span></div>
    <div class="row"><span class="k">需认证</span><span class="v tags">${chip(r.auth)}</span></div>
    <div class="row"><span class="k">备注</span><span class="v muted" style="font-size:11px">${esc(r.note || '—')}</span></div>`;
}
function paint(d, src) {
  paintKpi(d);
  paintOverview(d); paintExpire(d); paintAlerts(d); paintHw(d); paintRun(d);
  $('hd-base').textContent = '基准 ' + (d.base_local || '');
  $('ft-gen').textContent = '生成于 ' + (d.generated_at || d.base_local || '—');
  const s = $('ft-src');
  s.textContent = src === 'live' ? '实时' : (src === 'fetch' ? 'data.json' : '内嵌快照');
  s.className = 'src ' + (src === 'live' ? 'live' : (src === 'fetch' ? '' : 'snap'));
  const t = d.totals || {};
  const bad = (t.zero_pull || []).length || (t.expired || []).length || (t.stale || []).length || t.hits;
  $('hd-dot').className = 'dot' + (bad ? (t.hits || (t.stale || []).length ? ' err' : ' warn') : '');
  paintOverview(d);
}

/* ================= 交互 ================= */
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  state.tab = b.dataset.tab;
  ['ov', 'ex', 'al', 'hw', 'rn'].forEach(k =>
    $('tab-' + k).hidden = k !== state.tab);
});
$('q').addEventListener('input', e => { state.q = e.target.value; paintOverview(DATA); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; paintOverview(DATA); });
$('filters').addEventListener('click', e => {
  const b = e.target.closest('.fchip'); if (!b) return;
  document.querySelectorAll('.fchip').forEach(x => x.classList.toggle('on', x === b));
  state.f = b.dataset.f; paintOverview(DATA);
});

/* 启动：先内嵌快照立即渲染，再尝试升级到实时数据 */
paint(EMBED, 'embedded');
loadData(true);
</script>
