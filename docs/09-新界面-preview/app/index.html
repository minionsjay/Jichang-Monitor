<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机场监控台 · 作战室</title>
<link rel="stylesheet" href="styles.css?v=51">
</head>
<body>
<div class="app">

  <!-- ============================ 左导航 ============================ -->
  <aside class="nav">
    <div class="brand">
      <i class="brand-mark"></i>
      <div>
        <div class="brand-name">机场监控台</div>
        <div class="brand-sub" id="brandSub">airmon</div>
      </div>
    </div>

    <div class="nav-round">
      <i class="dot" id="roundDot"></i>
      <span id="roundText">读取中…</span>
    </div>

    <div class="nav-list" id="navList">
      <div class="nav-ind" id="navInd"></div>
      <button class="nav-item on" data-view="ov">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
        <span class="lb">总览</span><span class="k" data-k="ov"></span>
      </button>
      <button class="nav-item" data-view="exp">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <span class="lb">到期</span><span class="k" data-k="exp"></span>
      </button>
      <button class="nav-item" data-view="al">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 15V9a6 6 0 1 0-12 0v6l-2 3h16l-2-3z"/><path d="M10 21h4"/></svg>
        <span class="lb">告警</span><span class="k" data-k="al"></span>
      </button>
      <button class="nav-item" data-view="hw">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 18a4 4 0 0 1 .3-8 5.5 5.5 0 0 1 10.6 1.6A3.5 3.5 0 0 1 17 18z"/></svg>
        <span class="lb">华为云</span><span class="k" data-k="hw"></span>
      </button>
      <button class="nav-item" data-view="nd">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="1.4"/></svg>
        <span class="lb">节点</span><span class="k" data-k="nd"></span>
      </button>
      <button class="nav-item" data-view="lib">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l8-3 8 3v12l-8 3-8-3z"/><path d="M4 6l8 3 8-3M12 9v12"/></svg>
        <span class="lb">机场库</span><span class="k" data-k="lib"></span>
      </button>
      <button class="nav-item" data-view="kn">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h9a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M16 7h4v13h-4"/></svg>
        <span class="lb">知识</span><span class="k" data-k="kn"></span>
      </button>
      <button class="nav-item" data-view="an">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20h18"/><path d="M6 20V9M11 20V5M16 20v-7M21 20v-4"/></svg>
        <span class="lb">分析</span><span class="k" data-k="an"></span>
      </button>
      <button class="nav-item" data-view="run">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
        <span class="lb">运行</span><span class="k" data-k="run"></span>
      </button>
    </div>

    <div class="nav-foot">
      基准 <b id="footBase">—</b><br>
      数据 <b id="footBuilt">—</b>
    </div>
  </aside>

  <!-- ============================ 主区 ============================ -->
  <main class="main">
    <header class="top">
      <div class="top-t">
        <h1 id="vTitle">总览</h1>
        <p id="vSub">—</p>
      </div>
      <div class="top-spacer"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input id="q" type="search" placeholder="搜机场 / 节点 / 域名" autocomplete="off">
      </label>
      <button class="btn ghost" id="btnAct">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M3 12h18"/></svg>
        待办清单
      </button>
    </header>

    <div class="views" id="views">
      <section class="view on" data-v="ov" id="v-ov"></section>
      <section class="view" data-v="exp" id="v-exp"></section>
      <section class="view" data-v="al" id="v-al"></section>
      <section class="view" data-v="hw" id="v-hw"></section>
      <section class="view" data-v="nd" id="v-nd"></section>
      <section class="view" data-v="lib" id="v-lib"></section>
      <section class="view" data-v="kn" id="v-kn"></section>
      <section class="view" data-v="an" id="v-an"></section>
      <section class="view" data-v="run" id="v-run"></section>
    </div>
  </main>

  <!-- ============================ 右栏 ============================ -->
  <aside class="rail">
    <div class="rail-h">
      <h2>需要你动手</h2>
      <span class="n" id="actN">—</span>
    </div>
    <div class="rail-b">
      <div class="acts" id="actList"></div>
    </div>
    <div class="rail-meta">
      本轮 <b id="mRound">—</b><br>
      采集 <b id="mNodes">—</b> 节点 · 导出 <b id="mExp">—</b><br>
      数据源 <b>data/ · nodes/index.json</b>
    </div>
  </aside>
</div>

<!-- ============================ 抽屉 ============================ -->
<div class="backdrop" id="bd"></div>
<div class="modal" id="mdl">
  <div class="mdl-box">
    <div class="mdl-h"><h3 id="mdlT"></h3><button class="btn ghost xs" id="mdlX">关闭</button></div>
    <pre class="mdl-body" id="mdlB"></pre>
  </div>
</div>
<div id="toast"></div>

<aside class="drawer" id="dr">
  <div class="dr-h">
    <div>
      <h2 id="drTitle">—</h2>
      <div class="sub" id="drSub">—</div>
    </div>
    <button class="x" id="drX" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dr-b" id="drBody"></div>
</aside>

<script src="data.js?v=51"></script>
<script src="app.js?v=51"></script>
</body>
</html>
