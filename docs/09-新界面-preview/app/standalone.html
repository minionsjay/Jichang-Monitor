<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机场监控台 · 作战室</title>
<style>
/* ==========================================================================
   机场监控台 · 作战室（A 方向）
   深色控制台：矩阵定位、事件流解释、等宽数字对齐
   ========================================================================== */

:root {
  --bg: #07080a;
  --bg2: #0b0d11;
  --surface: #101318;
  --surface2: #151a21;
  --surface3: #1b212a;
  --line: #222833;
  --line2: #2e3543;
  --fg: #e7e9ee;
  --fg2: #b4bbc7;
  --fg3: #8b93a3;
  --green: #35d08a;
  --amber: #f2b33d;
  --blue: #5c8bff;
  --red: #f0555c;
  --teal: #3ee0b0;
  --violet: #9b8cff;
  --mono: "Cascadia Mono", "Consolas", "SF Mono", ui-monospace, monospace;
  --sans: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --nav-w: 218px;
  --rail-w: 322px;
  --top-h: 62px;
  --r: 6px;
  --ease: cubic-bezier(.22, .61, .36, 1);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: inherit; text-decoration: none; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #262c38; border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #333b4a; }

/* ---------------------------------------------------------------- 布局 */
.app {
  display: grid;
  grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--rail-w);
  grid-template-rows: 100%;
  height: 100vh;
}

/* ---------------------------------------------------------------- 左导航 */
.nav {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg2);
  border-right: 1px solid var(--line);
  padding: 0 0 10px;
}

.brand {
  height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  flex: none;
}

.brand-mark {
  width: 22px; height: 22px;
  border-radius: 5px;
  background: linear-gradient(150deg, var(--teal), #1d7f66);
  position: relative;
  flex: none;
}
.brand-mark::after {
  content: "";
  position: absolute; inset: 6px;
  border-radius: 2px;
  background: var(--bg2);
}

.brand-name { font-size: 14px; font-weight: 600; letter-spacing: .2px; }
.brand-sub { font-size: 11px; color: var(--fg3); font-family: var(--mono); margin-top: -2px; }

.nav-round {
  margin: 12px 12px 6px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--fg2);
}
.nav-round .dot { flex: none; }

.nav-list {
  position: relative;
  padding: 8px;
  margin: 0;
  list-style: none;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

.nav-ind {
  position: absolute;
  left: 8px; right: 8px;
  height: 36px;
  border-radius: 5px;
  background: var(--surface2);
  box-shadow: inset 2px 0 0 var(--teal);
  transform: translateY(0);
  transition: transform .34s var(--ease), height .2s var(--ease);
  pointer-events: none;
}

.nav-item {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  height: 36px;
  padding: 0 10px;
  border-radius: 5px;
  color: var(--fg2);
  font-size: 13.5px;
  text-align: left;
  transition: color .18s, background .18s;
}
.nav-item:hover { color: var(--fg); }
.nav-item.on { color: var(--fg); font-weight: 500; }
.nav-item .k {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg3);
}
.nav-item.on .k { color: var(--teal); }

.nav-ico {
  width: 16px; height: 16px;
  flex: none;
  opacity: .85;
}
.nav-item.on .nav-ico { opacity: 1; color: var(--teal); }

.nav-foot {
  flex: none;
  padding: 10px 16px 0;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--fg3);
  line-height: 1.7;
}
.nav-foot b { color: var(--fg2); font-weight: 500; font-family: var(--mono); }

/* ---------------------------------------------------------------- 主区 */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background:
    radial-gradient(900px 420px at 12% -10%, rgba(62, 224, 176, .055), transparent 70%),
    var(--bg);
}

.top {
  height: var(--top-h);
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 22px;
  border-bottom: 1px solid var(--line);
}

.top-t { min-width: 0; }
.top-t h1 {
  margin: 0;
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: .2px;
  line-height: 1.25;
}
.top-t p {
  margin: 1px 0 0;
  font-size: 12px;
  color: var(--fg3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.top-spacer { flex: 1; }

.search {
  position: relative;
  width: 230px;
}
.search input {
  width: 100%;
  height: 32px;
  padding: 0 10px 0 30px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  font-size: 13px;
  outline: none;
  transition: border-color .18s, background .18s;
}
.search input::placeholder { color: var(--fg3); }
.search input:focus { border-color: #3b4a63; background: var(--surface2); }
.search svg {
  position: absolute;
  left: 9px; top: 8px;
  width: 15px; height: 15px;
  color: var(--fg3);
  pointer-events: none;
}

.btn {
  height: 32px;
  padding: 0 12px;
  border-radius: var(--r);
  border: 1px solid var(--line2);
  background: var(--surface2);
  color: var(--fg);
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: transform .1s, background .18s, border-color .18s;
}
.btn:hover { background: var(--surface3); border-color: #3a4453; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--fg2); }
.btn.ghost:hover { color: var(--fg); border-color: var(--line2); }

.views {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}

.view {
  display: none;
  padding: 14px 22px 20px;
  min-height: 100%;
}
.view.on { display: block; }

/* 视图进场：形状到位（不交叉淡化） */
.view.on > * {
  animation: rise .42s var(--ease) both;
}
.view.on > *:nth-child(2) { animation-delay: .04s; }
.view.on > *:nth-child(3) { animation-delay: .08s; }
.view.on > *:nth-child(4) { animation-delay: .12s; }
.view.on > *:nth-child(5) { animation-delay: .16s; }

@keyframes rise {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: none; }
}

/* ---------------------------------------------------------------- 通用块 */
.sec {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  overflow: hidden;
}
.sec + .sec { margin-top: 14px; }

.sec-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.sec-h h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .3px;
  color: var(--fg);
}
.sec-h .n {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--fg3);
}
.sec-h .sp { flex: 1; }
.sec-b { padding: 12px; }
.sec-b.tight { padding: 10px 12px; }

.hint { font-size: 12.5px; color: var(--fg3); }

/* ---------------------------------------------------------------- KPI */
.kpis {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 14px;
}
.kpi {
  background: var(--surface);
  padding: 10px 14px 11px;
  min-width: 0;
}
.kpi .lb {
  font-size: 11.5px;
  color: var(--fg3);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.kpi .vl {
  font-family: var(--mono);
  font-size: 29px;
  line-height: 1.15;
  letter-spacing: -.5px;
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
}
.kpi .ft { font-size: 11.5px; color: var(--fg3); font-family: var(--mono); margin-top: 1px; }
.kpi.ok .vl { color: var(--green); }
.kpi.b .vl { color: var(--amber); }
.kpi.c .vl { color: var(--blue); }
.kpi.d .vl { color: var(--red); }
.kpi.t .vl { color: var(--teal); }

/* ---------------------------------------------------------------- 状态点 */
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--fg3);
  display: inline-block;
  flex: none;
}
.dot.ok { background: var(--green); box-shadow: 0 0 0 3px rgba(53, 208, 138, .14); }
.dot.b { background: var(--amber); box-shadow: 0 0 0 3px rgba(242, 179, 61, .14); }
.dot.c { background: var(--blue); box-shadow: 0 0 0 3px rgba(92, 139, 255, .14); }
.dot.d { background: var(--red); box-shadow: 0 0 0 3px rgba(240, 85, 92, .14); }
.dot.live { animation: pulse 2.2s var(--ease) infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .35; }
}

/* ---------------------------------------------------------------- 矩阵 */
.matrix {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--cw, 150px), 1fr));
  gap: var(--cg, 6px);
}
.cell {
  position: relative;
  min-width: 0;
  height: auto;
  min-height: var(--ch, 74px);
  display: flex;
  flex-direction: column;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--surface2);
  padding: 6px 7px 5px 9px;
  text-align: left;
  transition: border-color .16s, background .16s, transform .16s var(--ease);
  overflow: hidden;
}
.cell::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--fg3);
}
.cell.ok::before { background: var(--green); }
.cell.b::before { background: var(--amber); }
.cell.c::before { background: var(--blue); }
.cell.d::before { background: var(--red); }
.cell:hover {
  border-color: var(--line2);
  background: var(--surface3);
  transform: translateY(-1px);
}
.matrix[data-d="s"] { --cw: 124px; --ch: 66px; --cg: 6px; }
.matrix[data-d="s"] .nm { font-size: 12px; }
.matrix[data-d="s"] .ct { font-size: 15px; }
.matrix[data-d="s"] .ft { display: none; }

.matrix[data-d="m"] { --cw: 152px; --ch: 82px; --cg: 6px; }
.matrix[data-d="m"] .nm { font-size: 13px; }
.matrix[data-d="m"] .ct { font-size: 18px; }
.matrix[data-d="m"] .ex { display: none; }
.matrix[data-d="m"] .st { font-size: 11.5px; }

.matrix[data-d="l"] { --cw: 182px; --ch: 98px; --cg: 7px; }
.matrix[data-d="l"] .nm { font-size: 13.5px; }
.matrix[data-d="l"] .ct { font-size: 19px; }

.cell .st {
  font-size: 11.5px;
  color: var(--dim);
  letter-spacing: .02em;
}

.dseg {
  display: flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 7px;
}
.dseg-b {
  appearance: none;
  background: none;
  border: 0;
  color: var(--fg3);
  font: inherit;
  font-size: 12.5px;
  padding: 3px 9px;
  border-radius: 5px;
  cursor: pointer;
  transition: background .16s, color .16s;
}
.dseg-b:hover { color: var(--fg); }
.dseg-b.on { background: var(--raise2); color: var(--fg); }

.cell .nm {
  font-size: 11.5px;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}
.cell .ct {
  font-family: var(--mono);
  font-size: 17px;
  line-height: 1.15;
  margin-top: auto;
  letter-spacing: -.3px;
}
.cell .ft {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  margin-top: 3px;
  min-width: 0;
}
.cell .st {
  display: flex;
  align-items: baseline;
  gap: 4px;
  min-width: 0;
  flex: 0 1 auto;
}
.cell .stw {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cell .xd { flex: none; }
.cell.ok .ct { color: var(--green); }
.cell.b .ct, .cell.c .ct { color: var(--fg2); }
.cell.d .ct { color: var(--red); }
.cell .ex {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--fg3);
  white-space: nowrap;
  flex: none;
}
.cell .ex.bad { color: #ff9aa2; }
.cell .ex.dim { color: var(--fg3); }

/* ---------------------------------------------------------------- 构成条 */
.bars { display: grid; gap: 10px; }
.bar-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 5px;
}
.bar-row .cap {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 12px;
  color: var(--fg2);
}
.bar-row .cap b { color: var(--fg); font-weight: 500; }
.bar-row .cap .n { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--fg3); }
.stack {
  display: flex;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--surface3);
}
.stack > i {
  display: block;
  height: 100%;
  transition: width .5s var(--ease);
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 7px;
  font-size: 11.5px;
  color: var(--fg3);
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
.legend em { font-style: normal; font-family: var(--mono); color: var(--fg2); }

/* ---------------------------------------------------------------- 表格 */
.tbl-wrap { overflow-x: auto; }
table.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.tbl th {
  text-align: left;
  font-weight: 500;
  font-size: 11.5px;
  color: var(--fg3);
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}
table.tbl th.num, table.tbl td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.tbl td {
  padding: 8px 10px;
  border-bottom: 1px solid #1a1f27;
  color: var(--fg2);
  vertical-align: middle;
  overflow-wrap: anywhere;
}
table.tbl tbody tr { transition: background .14s; }
table.tbl tbody tr:hover { background: var(--surface2); }
table.tbl tbody tr:last-child td { border-bottom: 0; }
table.tbl td.nm { color: var(--fg); }
table.tbl .mono { font-family: var(--mono); font-size: 12px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 7px;
  border-radius: 4px;
  font-size: 11.5px;
  background: var(--surface3);
  color: var(--fg2);
  white-space: nowrap;
}
.pill.ok { background: rgba(53, 208, 138, .13); color: #7ee6b6; }
.pill.b { background: rgba(242, 179, 61, .13); color: #f6cd84; }
.pill.c { background: rgba(92, 139, 255, .14); color: #9db6ff; }
.pill.d { background: rgba(240, 85, 92, .13); color: #ff9a9e; }
.pill.t { background: rgba(62, 224, 176, .12); color: #86efd6; }
.pill.v { background: rgba(155, 140, 255, .14); color: #bdb2ff; }
.pill.g { background: rgba(53, 208, 138, .16); color: #7ee6b6; }
.pill.r { background: rgba(240, 85, 92, .18); color: #ff9a9e; }

.dotc {
  width: 6px; height: 6px;
  border-radius: 2px;
  display: inline-block;
  flex: none;
}

.mini-bar {
  position: relative;
  height: 5px;
  border-radius: 3px;
  background: var(--surface3);
  overflow: hidden;
  min-width: 64px;
}
.mini-bar > i {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 3px;
  background: var(--teal);
}
.mini-bar.warn > i { background: var(--amber); }
.mini-bar.bad > i { background: var(--red); }

/* ---------------------------------------------------------------- 筛选 chips */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  height: 27px;
  padding: 0 10px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg2);
  font-size: 12.5px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform .1s, background .16s, border-color .16s, color .16s;
}
.chip:hover { color: var(--fg); border-color: var(--line2); }
.chip:active { transform: translateY(1px); }
.chip.on {
  background: rgba(62, 224, 176, .1);
  border-color: rgba(62, 224, 176, .42);
  color: #9ff0da;
}
.chip .n {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg3);
}
.chip.on .n { color: #6fdcc0; }

/* ---------------------------------------------------------------- 事件流 / 行动 */
.acts { display: grid; gap: 0; }
.act {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid #1a1f27;
  cursor: pointer;
  transition: background .14s;
}
.act:last-child { border-bottom: 0; }
.act:hover { background: var(--surface2); }
.act .rd {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-top: 6px;
}
.act .t1 {
  display: flex;
  align-items: baseline;
  gap: 7px;
  font-size: 13px;
  color: var(--fg);
}
.act .t1 .d {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg3);
}
.act .t2 {
  font-size: 13px;
  color: var(--fg2);
  margin-top: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.act .t3 {
  font-size: 12.5px;
  color: var(--teal);
  margin-top: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ---------------------------------------------------------------- 右栏 */
.rail {
  border-left: 1px solid var(--line);
  background: var(--bg2);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.rail-h {
  height: var(--top-h);
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
}
.rail-h h2 { margin: 0; font-size: 13px; font-weight: 600; }
.rail-h .n { font-family: var(--mono); font-size: 11.5px; color: var(--fg3); }

.rail-b {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.rail-sec + .rail-sec { border-top: 1px solid var(--line); }
.rail-sec .hd {
  padding: 11px 16px 7px;
  font-size: 11.5px;
  color: var(--fg3);
  letter-spacing: .4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.rail-meta {
  flex: none;
  border-top: 1px solid var(--line);
  padding: 11px 16px 14px;
  font-size: 12.5px;
  color: var(--fg3);
  line-height: 1.8;
}
.rail-meta b { color: var(--fg2); font-weight: 500; font-family: var(--mono); }

/* ---------------------------------------------------------------- 图 */
.chart {
  width: 100%;
  height: 150px;
  display: block;
}
.chart .ln { fill: none; stroke: var(--teal); stroke-width: 1.6; }
.chart .ar { fill: url(#gTeal); }
.chart .gr { stroke: #1d232d; stroke-width: 1; }
.chart .tx { fill: var(--fg3); font-size: 10px; font-family: var(--mono); }

/* ---------------------------------------------------------------- 节点视图 */
.nodes-grid {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.apt-list {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  max-height: calc(100vh - 190px);
  overflow-y: auto;
}
.apt {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  padding: 7px 10px;
  border-bottom: 1px solid #191e26;
  text-align: left;
  transition: background .14s;
}
.apt:hover { background: var(--surface2); }
.apt.on { background: rgba(62, 224, 176, .07); box-shadow: inset 2px 0 0 var(--teal); }
.apt .an { font-size: 12.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.apt .ac { font-family: var(--mono); font-size: 11px; color: var(--fg3); }

.node-head {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.node-head h2 { margin: 0; font-size: 15px; font-weight: 600; }

.node-scroll { max-height: calc(100vh - 250px); overflow-y: auto; }
table.tbl.compact td { padding: 6px 10px; font-size: 12.5px; }
tr.dead td { color: var(--fg3); }
tr.dead td.nm { color: var(--fg2); }

/* ---------------------------------------------------------------- 机场库 */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
  gap: 10px;
}
.card {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  padding: 11px 12px 10px;
  cursor: pointer;
  transition: border-color .16s, background .16s, transform .16s var(--ease);
  min-width: 0;
}
.card:hover { border-color: var(--line2); background: var(--surface2); transform: translateY(-1px); }
.card .c1 { display: flex; align-items: center; gap: 7px; }
.card .cn { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cv { font-family: var(--mono); font-size: 11px; color: var(--fg3); margin-left: auto; flex: none; }
.card .c2 {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--fg2);
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card .c3 { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- 知识 */
.kn {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  padding: 13px 14px;
  transition: border-color .16s, background .16s;
}
.kn:hover { border-color: var(--line2); background: var(--surface2); }
.kn .k1 { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--fg3); }
.kn h3 { margin: 7px 0 5px; font-size: 14px; font-weight: 600; line-height: 1.45; }
.kn p {
  margin: 0;
  font-size: 12.5px;
  color: var(--fg2);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.kn .k3 { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }

.kn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }

/* ---------------------------------------------------------------- 华为云 */
.hw-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 14px;
}
.hw-c {
  background: var(--surface);
  padding: 12px 14px;
}
.hw-c .lb { font-size: 11.5px; color: var(--fg3); }
.hw-c .vl { font-family: var(--mono); font-size: 24px; margin-top: 2px; }
.hw-c .ft { font-size: 11px; color: var(--fg3); margin-top: 2px; font-family: var(--mono); }

.judges { display: flex; flex-wrap: wrap; gap: 5px; }

/* ---------------------------------------------------------------- 抽屉 */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(3, 4, 6, .55);
  opacity: 0;
  pointer-events: none;
  transition: opacity .24s var(--ease);
  z-index: 40;
}
.backdrop.on { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 880px;
  max-width: 96vw;
  background: var(--bg2);
  border-left: 1px solid var(--line2);
  transform: translateX(100%);
  transition: transform .29s var(--ease);
  z-index: 41;
  display: flex;
  flex-direction: column;
  box-shadow: -24px 0 60px rgba(0, 0, 0, .45);
}
.drawer.on { transform: none; }

.dr-h {
  flex: none;
  padding: 15px 18px 13px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.dr-h h2 { margin: 0; font-size: 17px; font-weight: 600; }
.dr-h .sub { font-size: 12px; color: var(--fg3); margin-top: 3px; font-family: var(--mono); }
.dr-h .x {
  margin-left: auto;
  width: 28px; height: 28px;
  border-radius: 5px;
  display: grid;
  place-items: center;
  color: var(--fg3);
  transition: background .16s, color .16s, transform .1s;
}
.dr-h .x:hover { background: var(--surface2); color: var(--fg); }
.dr-h .x:active { transform: scale(.94); }

.dr-b { flex: 1; overflow-y: auto; padding: 14px 18px 24px; }

.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 12.5px; }
.kv dt { color: var(--fg3); }
.kv dd { margin: 0; color: var(--fg2); word-break: break-all; }
.kv dd.mono { font-family: var(--mono); font-size: 12px; }

.sub-h {
  font-size: 11.5px;
  color: var(--fg3);
  letter-spacing: .4px;
  margin: 18px 0 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}

/* ---------------------------------------------------------------- 工具类 */
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.sp { flex: 1; }
.mt8 { margin-top: 8px; }
.mt14 { margin-top: 14px; }
.mono { font-family: var(--mono); }
.dim { color: var(--fg3); }
.fg2 { color: var(--fg2); }
.r { text-align: right; }
.nowrap { white-space: nowrap; }
.small { font-size: 12.5px; }
.xsmall { font-size: 12px; }
.hide { display: none !important; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }

/* ---------------------------------------------------------------- 响应式 */
@media (max-width: 1400px) {
  :root { --rail-w: 286px; --nav-w: 200px; }
}
@media (max-width: 1160px) {
  .app { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  .rail { display: none; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hw-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: 1fr; }
  .nodes-grid { grid-template-columns: 1fr; }
  .apt-list { max-height: 220px; }
}
@media (max-width: 820px) {
  :root { --nav-w: 62px; }
  .brand-name, .brand-sub, .nav-item span.lb, .nav-item .k, .nav-foot { display: none; }
  .nav-round { display: none; }
  .nav-item { justify-content: center; padding: 0; }
  .nav-ind { left: 6px; right: 6px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top { padding: 0 12px; gap: 10px; }
  .search { width: 150px; }
  .view { padding: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

/* ---------- 抽屉里的机场信息与拉取 ---------- */
.apwrap { display: grid; gap: 1px; background: var(--line); border-radius: 6px; overflow: hidden; }
.aprow { display: grid; grid-template-columns: 78px 1fr; gap: 10px; background: var(--surface2); padding: 7px 10px; }
.apk { font-size: 12px; color: var(--dim); letter-spacing: .02em; }
.apv { font-size: 12.5px; color: var(--fg); min-width: 0; overflow-wrap: anywhere; }
.apv a.link { color: var(--blue); text-decoration: none; border-bottom: 1px solid rgba(92,139,255,.35); }
.apv a.link:hover { border-bottom-color: var(--blue); }
.apv .mono { font-size: 12px; }

.btn {
  appearance: none;
  font: inherit;
  font-size: 13px;
  padding: 7px 14px;
  border-radius: 7px;
  border: 1px solid var(--line2);
  background: var(--raise);
  color: var(--fg);
  cursor: pointer;
  transition: background .16s, border-color .16s, transform .08s;
}
.btn:hover { background: var(--raise2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #0a0d12; font-weight: 600; }
.btn.primary:hover { background: #7aa2ff; border-color: #7aa2ff; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.mini { padding: 3px 9px; font-size: 12px; border-radius: 6px; }

.logbox {
  margin-top: 8px;
  max-height: 168px;
  overflow: auto;
  background: #0b0d11;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--fg2);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.logbox .ok { color: var(--green); }
.logbox .bad { color: var(--red); }

.spin {
  display: inline-block;
  width: 11px; height: 11px;
  border: 1.5px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: sp .7s linear infinite;
  vertical-align: -1px;
  margin-right: 5px;
}
@keyframes sp { to { transform: rotate(360deg); } }

/* ---------- 抽屉里的全量节点表 ---------- */
.nodewrap { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; }
.nodetbl { width: 100%; border-collapse: separate; border-spacing: 0; }
.nodetbl thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface2);
  border-bottom: 1px solid var(--line2);
  font-size: 11.5px; font-weight: 600; color: var(--dim);
  text-align: left; padding: 6px 8px; letter-spacing: .02em;
}
.nodetbl tbody td { padding: 4px 8px; border-bottom: 1px solid var(--line); }
.nodetbl tbody tr:last-child td { border-bottom: 0; }
.nodetbl tbody tr:hover td { background: rgba(255,255,255,.025); }
.nodetbl .nowrap { white-space: nowrap; }

/* ---------- 「只能用客户端获取」徽标 ---------- */
.cell .cl {
  position: absolute;
  top: 4px; right: 4px;
  font-style: normal;
  font-size: 9.5px;
  line-height: 1.35;
  padding: 0 3px;
  border-radius: 3px;
  color: #a8bcff;
  background: rgba(92, 139, 255, .16);
  border: 1px solid rgba(92, 139, 255, .38);
  letter-spacing: .02em;
}
.cell[data-d="s"] .cl { font-size: 9px; padding: 0 2px; }
i.cl.inline { position: static; display: inline-block; vertical-align: 1px; }
.cell .nm { padding-right: 24px; }
.cell[data-d="s"] .nm { padding-right: 20px; }

/* 改订阅地址的编辑区 */
.subedit {
  margin-top: 4px;
  padding: 10px 12px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface2);
}
.subedit .inp {
  width: 100%;
  padding: 7px 9px;
  border-radius: 6px;
  border: 1px solid var(--line2);
  background: var(--bg2);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
}
.subedit .inp::placeholder { color: var(--fg3); font-family: var(--sans); font-size: 12px; }
.subedit .inp:focus { outline: none; border-color: #3b4a63; background: var(--surface); }
.subedit .okc { color: var(--green); }

/* 卡片上的中文名 + 英文副名 */
.cell .nm .en {
  font-style: normal;
  font-size: 9.5px;
  color: var(--fg3);
  margin-left: 4px;
  font-family: var(--mono);
  letter-spacing: 0;
  display: inline-block;
  max-width: 54px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
}
.matrix[data-d="s"] .cell .nm .en { display: none; }

/* 表格 / 标题里的英文副名 */
.en2 {
  font-style: normal;
  font-size: 11px;
  color: var(--fg3);
  margin-left: 6px;
  font-family: var(--mono);
  letter-spacing: 0;
}
h2 .en2 { font-size: 12.5px; margin-left: 8px; }
#drTitle .en2 { font-size: 12px; margin-left: 8px; }

/* ---------- 抽屉里的已知域名表 ---------- */
.domtbl td { vertical-align: top; }
.domtbl .thc { text-align: center; width: 54px; }
.domtbl .okc { color: var(--green); }
.domtbl a.link { color: var(--blue); text-decoration: none; border-bottom: 1px solid rgba(92,139,255,.3); }
.domtbl a.link:hover { border-bottom-color: var(--blue); }

/* ---------- 套餐到期标记（行内，不压任何文字） ---------- */
.cell .xd {
  display: inline-block;
  vertical-align: 1px;
  font-style: normal;
  font-size: 9.5px;
  line-height: 1.35;
  padding: 0 3px;
  border-radius: 3px;
  color: #ff9aa2;
  background: rgba(240, 85, 92, .14);
  border: 1px solid rgba(240, 85, 92, .42);
  letter-spacing: .02em;
}
.cell .stx { color: var(--red); }
/* 订阅「限时开关」被机场关掉：和「到期」同形但走灰蓝，避免红色被当成故障 */
.cell .xd.subc {
  color: #b9c2d6;
  background: rgba(124, 132, 147, .22);
  border-color: rgba(124, 132, 147, .55);
}
.bad { color: var(--red); font-weight: 600; }

.cell .stx { color: var(--red); }
.cell.exp::before { background: var(--red); }
/* 紧凑档：状态行被隐藏，到期标记改贴右下角，保证任何密度都看得见 */
.matrix[data-d="s"] .cell.exp::after {
  content: "到期";
  position: absolute;
  right: 5px; bottom: 4px;
  font-size: 9.5px;
  line-height: 1.4;
  padding: 0 3px;
  border-radius: 3px;
  color: #ff9aa2;
  background: rgba(240, 85, 92, .16);
  border: 1px solid rgba(240, 85, 92, .45);
  letter-spacing: .02em;
}

/* 华为云/CDN 高亮（承载归属行与节点表共用） */
.hot{color:var(--red);font-weight:600}


/* ---------- 弹窗（订阅原文等长文本）与轻提示 ---------- */
.modal{position:fixed;inset:0;background:rgba(6,8,13,.74);display:none;z-index:60;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.mdl-box{width:min(1020px,94vw);max-height:84vh;background:var(--bg2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.55)}
.mdl-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mdl-h h3{margin:0;font-size:14px;font-weight:600;color:var(--fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdl-body{margin:0;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.75;color:var(--fg2);white-space:pre-wrap;word-break:break-all}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(8px);background:var(--bg3);border:1px solid var(--line);color:var(--fg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:70;max-width:70vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 抽屉：IP 与归属宽表 */
.ipmore {
  display: inline-block;
  margin-left: 4px;
  padding: 0 4px;
  border-radius: 3px;
  background: var(--surface3, #263041);
  color: var(--fg3);
  font-size: 9.5px;
  vertical-align: 1px;
}
.ipalt {
  display: inline-block;
  padding: 0 5px;
  border-radius: 3px;
  background: rgba(92, 139, 255, .16);
  color: #8fb0ff;
  font-size: 10px;
}
.xxsmall { font-size: 10.5px; }

/* 旧口径灰标：不算结论，只是历史记录 */
.tag.old{display:inline-block;margin-left:4px;padding:1px 5px;border-radius:3px;font-size:10px;
  line-height:1.5;letter-spacing:.02em;background:color-mix(in srgb,var(--line) 70%,transparent);
  color:var(--dim);border:1px solid var(--line);vertical-align:1px}

</style>
</head>

nformation Center","share":0.5,"orgs_n":3,"nodes":4},"xm999":{"top_org":"NET-151-242-2-0-24","share":0.936,"orgs_n":3,"nodes":47},"yiyuan":{"top_org":"Leaseweb USA, Inc.","share":0.083,"orgs_n":33,"nodes":60}},"knowledge":[{"slug":"anytls","title":"AnyTLS 协议是什么？原理、客户端支持与机场清单","cat":"协议科普","date":"2026-07-30","n":7,"doms":[],"excerpt":"先说它解决什么问题。 你挂代理访问 HTTPS 网站时，流量结构是「TLS 隧道里面又包了一层 TLS」——外层是你到代理服务器的加密，内层是浏览器到目标网站的加密。这就是所谓 TLS in TLS。麻烦在于：这种嵌套结构的握手包长度和方向序列有固定模式，正常的网页请求不长这样。防火墙不需要解密任何内容，只要统计包长特征，就能以相当高的准确率判断「这是一条代理隧道」，然后掐掉。近几年大量 Trojan、SS+TLS 类节点莫名被封，这套"},{"slug":"hysteria2","title":"Hysteria2 协议是什么？原理、UDP 被限速怎么办与机场清单","cat":"协议科普","date":"2026-08-15","n":10,"doms":["example.com"],"excerpt":"Hysteria2 是开源项目 apernet/hysteria 的第二代协议，MIT 许可，仓库两万两千多颗星，2026 年 8 月 14 日仍有代码推送，最新发布版本是 8 月 9 日的 v2.12.1——这是一个还在积极开发的项目，不是无人维护的老古董。 它和本站写过的另外两个协议，走的是完全不同的路线： 这三条路线拼起来，才是 2026 年机场协议的完整坐标系。前两个都在 TCP + TLS 这条线上比谁藏得更好，Hysteri"},{"slug":"reality","title":"Reality 协议是什么？借真网站的证书伪装，但机场用得不多","cat":"协议科普","date":"2026-09-09","n":7,"doms":[],"excerpt":"很多人把 Reality 和 VLESS、Trojan、Hysteria2 并列，当成&quot;另一种协议&quot;。这个理解会让后面全都对不上。 Xray 官方文档说得很明确： REALITY 是对 TLS 的一种修改，通过借用目标站点的 TLS 外观与握手特征来完成伪装。 以及： REALITY 只是修改了 TLS。 所以它在整条链路里的位置是这样的： 代理协议（谁来搬运数据）：VLESS、Trojan、VMess…… 传输安全"},{"slug":"shadowsocks","title":"Shadowsocks和VMess是什么?2026年还能不能用","cat":"协议科普","date":"2026-08-16","n":9,"doms":[],"excerpt":"Shadowsocks（简称 SS）和 VMess 是两个上一代的翻墙协议，2026 年都还在用，但活法已经变了。 先给三个最常被问到的答案： 「V2Ray」不是协议名。 它是一个软件项目，里面跑的协议叫 VMess。大家叫顺口了，机场也就跟着这么写。 两者都还没死。 本站 130 多篇机场评测里，41 家支持 Shadowsocks、34 家支持 V2Ray（即 VMess 一系），仍然是站内覆盖面最广的两个协议。 但它们的适用场景收"},{"slug":"trojan","title":"Trojan 协议是什么？原理、2026 现状与机场清单","cat":"协议科普","date":"2026-07-31","n":8,"doms":[],"excerpt":"先把最大的误会拆了：Trojan 和杀毒软件说的「木马病毒」没有任何关系，只是重名。它是 2019 年在 GitHub 开源的代理协议（项目名 trojan-gfw），名字致敬的是特洛伊木马的思路——不硬闯城门，混在人群里进城。 它的原理用一个场景就能讲明白。一台 Trojan 服务器对外就是一台普普通通的 HTTPS 网站服务器：443 端口、真实域名、有效证书，浏览器直接访问它，能打开一个正常网页。区别发生在 TLS 握手完成之后的"},{"slug":"vless","title":"VLESS 协议是什么？它本身不加密，安全吗看外面那层","cat":"协议科普","date":"2026-09-09","n":8,"doms":[],"excerpt":"先给官方定义。Xray 文档对 VLESS 的第一句话是： VLESS 是一个无状态的轻量传输协议，它分为入站和出站两部分，可以作为 Xray 客户端和服务器之间的桥梁。 「无状态」「轻量」这两个词是它全部设计取舍的来源。但对使用者来说，真正需要记住的是紧跟着的第二句： VLESS 必须配合传输安全层使用。 官方还给了一条例外说明，把边界划得很清楚： 只有当对端是 private 地址（如私有 IP、私有域名）且链路处于受信网络中，或者"},{"slug":"vless-clash","title":"VLESS 节点导不进 Clash？各平台该换哪个客户端","cat":"协议科普","date":"2026-09-09","n":7,"doms":[],"excerpt":"遇到「节点导不进去」「导进去全红」，第一反应往往是怀疑机场。但先做这一步，能省掉大量折腾： 把机场订阅里的 VLESS、Hysteria2、AnyTLS 三种节点，分别试着导入一次。 三种都导不进去 → 一定是客户端内核太老。这三个协议出现的时间不同，一个客户端不可能同时&quot;恰好&quot;不支持三个，只可能是它的内核停留在这三者出现之前。换机场解决不了。 只有某一种不行 → 可能是客户端版本偏旧（部分支持），升级到最新版再试。"},{"slug":"xieyi-duibi","title":"VLESS、VMess、Trojan 有什么区别？六个协议逐对比较","cat":"协议科普","date":"2026-09-09","n":8,"doms":[],"excerpt":"搜「机场协议对比」出来的文章，大多会把 Shadowsocks、VMess、VLESS、Trojan、Reality、AnyTLS、Hysteria2 摆成一排打分。这个排法本身就是错的，因为它们不在同一层： 理解这个分层，很多困惑会自动消失： 「VLESS 和 Reality 哪个好」是伪问题 —— 它们是搭配关系，正确写法是 VLESS+Reality； 「为什么节点名这么长」 —— VLESS + Vision + Reality"},{"slug":"xieyi-kehuduan","title":"机场客户端怎么选？AnyTLS、Hysteria2按协议对照表","cat":"协议科普","date":"2026-10-19","n":7,"doms":[],"excerpt":"不知道自己的节点是什么协议，有三个办法： 看机场后台或官网公告，大多会写&quot;本站使用 AnyTLS / Hysteria2 协议&quot; 看节点分享链接的开头：vmess://、vless://、trojan://、ss://、ssr://、hysteria2://（或 hy2://）、tuic://、anytls:// 看 Clash 订阅里每个节点的 type: 字段，值就是协议名 节点名里写的&quot;IPLC&qu"},{"slug":"huawei-detect-judges","title":"华为云机场流量检测：数据面、判据与评分卡","cat":"检测研究","date":"2026-10-19","n":6,"doms":[],"excerpt":"识别对象是「云上代理服务端」——租户在云主机上搭翻墙/机场服务。三条铁律：只分析自己账号/VPC 内的日志（自采自用合法）；不对第三方主动探测（端口扫描、指纹投递均不做）；不训练模型，判据全部是可解释规则。注意机场服务端会主动伪装成正常业务（443 大流量 HTTPS），所以单一信号不可定罪，必须多判据叠加评分。"},{"slug":"baxianchao","title":"2026 拔线潮：机场为什么集体掉线，还要持续多久","cat":"行业知识","date":"2026-08-07","n":8,"doms":[],"excerpt":"先把事情本身说清楚。 「拔线潮」不是一个官方名词，是这一年机场圈自己叫开的说法，指的是国内机房里被用于跨境代理的中转服务器被要求物理拔线——不是限速、不是封 IP，是直接断掉。对机场来说，这意味着上游线路成批断供，而且有钱也买不到新的。 我核了三个独立来源，起点的说法有出入，这里如实并列，不替它们统一成一个假精确的日期： 综合起来比较稳妥的说法是：3 月下旬开始陆续出现，4 月初集中爆发。 ⚠️ 关于那份「整改文件」：本站没有见到原始文"},{"slug":"beilv","title":"机场流量倍率是什么?2 倍率就是流量减半,买之前必须先算这一步","cat":"行业知识","date":"2026-08-18","n":9,"doms":[],"excerpt":"你买的机场套餐写着「300GB / 月」。这个数字不是你能传输的数据量，而是账户里的额度。 两者之间隔着一个叫倍率（也叫「流量倍率」「计费倍率」，英文常写 Rate 或 Multiplier）的东西。 倍率决定你每传 1GB 数据，要从额度里扣掉多少： 所以同样是「300G 套餐」，在不同机场、甚至同一机场的不同线路上，实际能用的量可以差 50 倍。 这就是为什么只比套餐标价和标称流量，几乎必然比错。"},{"slug":"fangpian","title":"机场防骗甄别指南：看穿假官网、跑路与杀猪盘","cat":"行业知识","date":"2026-06-12","n":10,"doms":[],"excerpt":"翻墙圈有句老话：「机场的尽头是跑路。」 这不是危言耸听——便宜、老牌、知名的机场，都有可能在某天消失。所以本指南的目标不是教你找一个「永不跑路」的机场（不存在），而是两件更实际的事： 不被专门设计的骗局收割（假官网、杀猪盘、永久套餐这些是「主动设计来骗你」的，可以识别）。 把每一次损失控制到最小（月付、备用、独立密码这些纪律，能让任何一家跑路都不至于让你伤筋动骨）。 跑路 ≠ 被骗。一家运营多年的正经机场因上游拔线而倒下，和一个从一开始"}],"sites":[{"name":"悄咪咪云","cat":"按量付费","dom":"qiaomimi.cloud","date":"2026-10-09","free":"免费,试用,注册送,邀请码","protos":"AnyTLS,Clash,Hysteria,Hysteria2,Reality,VLESS","rel":"未监控"},{"name":"老司机云","cat":"便宜机场","dom":"m.lsjyun.de","date":"2026-10-09","free":"免费,试用,注册送,邀请码","protos":"Clash,Reality,VLESS","rel":"未监控"},{"name":"全球云","cat":"便宜机场","dom":"quanqiuyun.org","date":"2026-10-09","free":"免费,试用,注册送,邀请码","protos":"Clash,Shadowsocks,V2Ray,VLESS","rel":"未监控"},{"name":"光年梯","cat":"便宜机场","dom":"guangnianertt1.homes","date":"2026-10-07","free":"免费,试用,注册送,邀请码","protos":"Clash,Reality,V2Ray,VLESS","rel":"未监控"},{"name":"千速云和仟速云是一家吗？","cat":"便宜机场","dom":"kk-speed.com","date":"2026-10-07","free":"免费,试用,注册送,邀请码","protos":"Clash","rel":"未监控"},{"name":"折花令","cat":"便宜机场","dom":"zhehua.store","date":"2026-10-07","free":"免费,试用,注册送,邀请码","protos":"Clash,VLESS","rel":"未监控"},{"name":"念云","cat":"便宜机场","dom":"xnyun.wiki","date":"2026-10-06","free":"免费,试用,体验,注册送,邀请码","protos":"Clash","rel":"未监控"},{"name":"Seele Cloud","cat":"便宜机场","dom":"cdn.xiercloud.uk","date":"2026-10-06","free":"免费,试用,注册送,邀请码","protos":"AnyTLS,Clash","rel":"未监控"},{"name":"特朗普云","cat":"便宜机场","dom":"trump-cloud.com","date":"2026-10-06","free":"免费,试用,体验,注册送,邀请码","protos":"Clash,V2Ray,VLESS","rel":"未监控"},{"name":"肯の机","cat":"高端机场","dom":"kendeji.io","date":"2026-10-05","free":"体验,邀请码","protos":"AnyTLS,Clash,Reality,SSR,V2Ray,VLE (function () {
  "use strict";

  var D = window.AIRMON;
  if (!D) { document.body.innerHTML = "<p style='padding:40px;color:#f0555c'>data.js 未加载</p>"; return; }

  /* ------------------------------------------------------------ 工具 */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function num(n) {
    if (n == null || isNaN(n)) return "—";
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function pct(a, b) { return b ? Math.round((a / b) * 1000) / 10 : 0; }
  function signed(n) { return n > 0 ? "+" + num(n) : num(n); }
  function bytesMB(b) {
    if (b == null) return "—";
    return (b / 1048576).toFixed(0) + " MB";
  }
  function relTime(iso) {
    if (!iso) return "—";
    var t = Date.parse(iso);
    if (isNaN(t)) return String(iso).slice(0, 16).replace("T", " ");
    var dh = (Date.now() - t) / 3600000;
    if (dh < 1) return Math.max(1, Math.round(dh * 60)) + " 分钟前";
    if (dh < 48) return dh.toFixed(1).replace(".0", "") + " 小时前";
    return Math.round(dh / 24) + " 天前";
  }
  function shortTime(iso) {
    if (!iso) return "—";
    var t = Date.parse(iso);
    if (isNaN(t)) return String(iso).slice(0, 16).replace("T", " ");
    var d = new Date(t);
    var p = function (x) { return (x < 10 ? "0" : "") + x; };
    return (d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  var STATE_CLS = { A: "ok", B: "b", C: "c", D: "d" };

  function stName(s) { return STATE_NAME[s] || s || "—"; }

  var PROTO_COLOR = {
    anytls: "#3ee0b0", vless: "#5c8bff", ss: "#f2b33d", hysteria2: "#9b8cff",
    trojan: "#35d08a", vmess: "#f0763d", unknown: "#4a5261", mieru: "#6b7280",
    vmux: "#7c8798", hysteria: "#c084fc", ninja: "#f472b6", aero_v2: "#22d3ee"
  };
  function protoColor(p) { return PROTO_COLOR[p] || "#4a5261"; }
  var GEO_COLOR = ["#3ee0b0", "#5c8bff", "#f2b33d", "#9b8cff", "#35d08a", "#f0763d", "#22d3ee", "#f472b6", "#c084fc", "#94a3b8"];

  function daysText(d) {
    if (d == null) return "—";
    if (d < 0) return "已过期 " + (-d) + " 天";
    return d + " 天";
  }
  function daysCls(d) {
    if (d == null) return "dim";
    if (d < 0) return "pill d";
    if (d <= 7) return "pill d";
    if (d <= 30) return "pill b";
    return "pill t";
  }
  function pill(cls, txt) { return '<span class="' + cls + '">' + txt + "</span>"; }
  function dot(cls) { return '<i class="dot ' + cls + '"></i>'; }

  /* ------------------------------------------------------------ 状态 */
  var S = { view: "ov", q: "", al: "all", lib: "all", kn: "all", nd: null, ndProto: "all", density: "m", drawn: {} };

  var T = D.totals || {};
  var APTS = D.airports || [];
  var bySlug = {};
  APTS.forEach(function (a) { bySlug[a.slug] = a; });
  /* 机场显示名：优先中文名，英文 slug 作副标题 */
  function nmOf(a) { return (a && (a.name_cn || a.slug)) || "—"; }
  function nmBySlug(slug) { var a = bySlug[slug]; return nmOf(a || { slug: slug }); }
  /* 中文名才需要英文副名；纯 ASCII 品牌名（BYWAVE/DOVE/Mitce…）不重复显示 */
  function enSuffix(a) { return (a && a.name_cn && /[^\x00-\x7F]/.test(a.name_cn) && a.slug.length <= 10) ? '<i class="en">' + esc(a.slug) + "</i>" : ""; }
  function enSuffix2(a) { return (a && a.name_cn && /[^\x00-\x7F]/.test(a.name_cn) && a.slug.length <= 14) ? '<i class="en2">' + esc(a.slug) + "</i>" : ""; }

  var ORDER = { D: 0, B: 1, C: 2, A: 3 };
  var SORTED = APTS.slice().sort(function (x, y) {
    var o = (ORDER[x.state] == null ? 9 : ORDER[x.state]) - (ORDER[y.state] == null ? 9 : ORDER[y.state]);
    return o !== 0 ? o : (y.nodes - x.nodes);
  });

  /* ------------------------------------------------------------ 数字滚动（首次入场） */
  var counted = {};
  function countUp(node, target, dur) {
    if (!node) return;
    var start = performance.now();
    var d = dur || 620;
    var from = 0;
    function frame(t) {
      var p = Math.min(1, (t - start) / d);
      var e = 1 - Math.pow(1 - p, 3);
      node.textContent = num(Math.round(from + (target - from) * e));
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function countOnce(key, node, target) {
    if (counted[key]) { node.textContent = num(target); return; }
    counted[key] = 1;
    countUp(node, target);
  }

  /* ------------------------------------------------------------ 总览 */
  function renderOverview(force) {

    ];

        '<div class="lb">' + esc(k.lb) + "</div>" +
        '<div class="vl" data-cnt="' + i + '">0</div>' +
        '<div class="ft">' + esc(k.ft) + "</div></div>";

    h += "</div>";

    h += '<div class="sec"><div class="sec-h"><h2>机场矩阵</h2>' +
      '<span class="n">' + num(APTS.length) + " 家 · 按状态排序</span>" +
      '<span class="sp"></span>' +
      '<div class="row small dim" style="gap:12px">' +
      '<span class="row" style="gap:5px">' + dot("ok") + "可用 " + T.ok + "</span>" +
      '<span class="row" style="gap:5px">' + dot("b") + "异常 " + T.b + "</span>" +
      '<span class="row" style="gap:5px">' + dot("c") + "仅客户端 " + T.c + "</span>" +
      '<span class="row" style="gap:5px">' + dot("d") + "断流 " + T.d + "</span>" +

      "</div>" +
      '<div class="dseg" role="group" aria-label="卡片尺寸">' +
      ["s", "m", "l"].map(function (k) {
        var lbl = { s: "小", m: "中", l: "大" }[k];
        return '<button class="dseg-b' + (S.density === k ? " on" : "") + '" data-d="' + k + '">' + lbl + "</button>";
      }).join("") +
      "</div></div>";
    h += '<div class="sec-b"><div class="matrix" id="mx" data-d="' + S.density + '">';
    SORTED.forEach(function (a) {
      var cls = stCls(a.state);
      var clOnly = a.type === "client" && !a.has_sub;

      /* 订阅「限时开关」被机场关掉：不是故障，是面板上的开关到点自动关。

  function barBlock(title, pairs, colorFn, unit) {
    var arr = pairs.filter(function (p) { return Array.isArray(p) && p[1] > 0; });
    var total = arr.reduce(function (s, p) { return s + p[1]; }, 0) || 1;
    var top = arr.slice(0, 8);
    var rest = arr.slice(8).reduce(function (s, p) { return s + p[1]; }, 0);
    if (rest > 0) top.push(["其他", rest]);

    var h = '<div class="sec"><div class="sec-h"><h2>' + esc(title) + "</h2>" +
      '<span class="n">' + num(total) + " " + esc(unit) + "</span></div>" +
      '<div class="sec-b"><div class="bars">';

    var stack = '<div class="stack">';
    top.forEach(function (p, i) {
      var c = colorFn ? colorFn(p[0]) : GEO_COLOR[i % GEO_COLOR.length];
      stack += '<i style="width:' + pct(p[1], total) + "%;background:" + c + '" title="' + esc(p[0]) + " " + num(p[1]) + '"></i>';
    });
    stack += "</div>";

    h += '<div class="bar-row"><div class="cap"><b>合计</b><span class="n">' + num(total) + "</span></div>" + stack +

      '<div class="legend">';
    top.forEach(function (p, i) {
      var c = colorFn ? colorFn(p[0]) : GEO_COLOR[i % GEO_COLOR.length];
      h += "<span><i style=\"background:" + c + '"></i>' + esc(p[0]) + " <em>" + num(p[1]) + "</em></span>";
    });
    h += "</div></div></div></div></div>";
    return h;
  }

  function lineChart(dates, vals) {
    var W = 900, H = 168, pad = { l: 40, r: 12, t: 12, b: 22 };
    if (!vals.length) return '<div class="hint">暂无时序数据</div>';
    var max = Math.max.apply(null, vals) || 1;
    var min = Math.min.apply(null, vals);
    var lo = Math.max(0, min - (max - min) * 0.25);
    var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    var x = function (i) { return pad.l + (vals.length < 2 ? iw / 2 : (i / (vals.length - 1)) * iw); };
    var y = function (v) { return pad.t + ih - ((v - lo) / (max - lo || 1)) * ih; };

    var d = "";
    vals.forEach(function (v, i) { d += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " "; });
    var area = d + "L" + x(vals.length - 1).toFixed(1) + " " + (pad.t + ih) + " L" + x(0).toFixed(1) + " " + (pad.t + ih) + " Z";

    var g = "";
    for (var k = 0; k <= 3; k++) {
      var gy = pad.t + (ih / 3) * k;
      var gv = Math.round(max - ((max - lo) / 3) * k);
      g += '<line class="gr" x1="' + pad.l + '" y1="' + gy + '" x2="' + (W - pad.r) + '" y2="' + gy + '"/>';
      g += '<text class="tx" x="' + (pad.l - 6) + '" y="' + (gy + 3.5) + '" text-anchor="end">' + gv + "</text>";
    }
    var idxs = [0, Math.floor(vals.length / 2), vals.length - 1];
    idxs.forEach(function (i) {
      if (dates[i] == null) return;
      g += '<text class="tx" x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? "start" : i === vals.length - 1 ? "end" : "middle") + '">' + esc(String(dates[i]).slice(5)) + "</text>";
    });

    return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="30 天节点总量">' +
      '<defs><linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#3ee0b0" stop-opacity=".28"/><stop offset="1" stop-color="#3ee0b0" stop-opacity="0"/></linearGradient></defs>' +
      g + '<path class="ar" d="' + area + '"/><path class="ln" d="' + d + '"/></svg>';
  }

    var runs = D.runs || [];
    h += '<div class="sec mt14"><div class="sec-h"><h2>历史轮次</h2><span class="n">最近 ' + runs.length + ' 轮 · 点一行看本轮失败名单</span></div><div class="sec-b tight">';

      runs.slice().reverse().forEach(function (x, i) {
        var du = x.duration_s ? (x.duration_s / 60).toFixed(1) + "m" : "—";
        var stc = x.derived ? "pill" : (x.status === "ok" ? "pill ok" : "pill d");
        var stt = x.derived ? "还原" : esc(x.status || "—");
        var nf = (x.failed || []).length;
        h += '<tr class="rrow" data-i="' + i + '"' + (nf ? ' style="cursor:pointer"' : "") + '>' +
          '<td class="mono xsmall">' + esc(shortTime(x.started_at)) + "</td>" +
          '<td class="mono xsmall">' + du + "</td>" +
          '<td class="xsmall dim">' + (x.trigger === "scheduled" ? "定时" : "手动") + "</td>" +
          "<td>" + pill(stc, stt) + "</td>" +
          '<td class="mono xsmall">' + (x.pull_ok == null ? "—" : x.pull_ok) + " / " + (x.pull_fail == null ? "—" : x.pull_fail) + "</td>" +
          '<td class="r mono">' + (x.nodes_total == null ? "—" : num(x.nodes_total)) + "</td>" +
          '<td class="r mono ' + (x.stale_n ? "" : "dim") + '">' + (x.stale_n == null ? "—" : x.stale_n) + "</td></tr>";
        if (nf) {
          h += '<tr class="rdet" data-i="' + i + '" style="display:none"><td colspan="7" class="xsmall dim" style="padding-left:20px">' +
            nf + " 家失败：" +
            esc(x.failed.slice(0, 18).map(function (f) {
              return (f && typeof f === "object") ? (f.slug + (f.reason ? "（" + String(f.reason).slice(0, 28) + "）" : "")) : String(f);
            }).join("、")) + (nf > 18 ? " …" : "") + "</td></tr>";
        }
      });
      h += "</tbody></table></div></div>";
    }

    var stale = r.stale || [];
    h += '<div class="sec"><div class="sec-h"><h2>陈旧机场</h2><span class="n">最近快照超过 6 小时</span></div><div class="sec-b">';
    if (stale.length) {
      h += '<div class="row wrap" style="gap:6px">' + stale.map(function (s) { return pill("pill b", esc(s)); }).join("") + "</div>";
    } else {
      h += '<span class="dim small">全部机场都在 6 小时内更新过。</span>';
    }
    h += "</div></div>";

    var tail = D.logTail || [];
    h += '<div class="sec mt14"><div class="sec-h"><h2>运行日志</h2><span class="n">run.log 尾部 ' + tail.length + " 行 · 地址与凭据已隐</span></div>" +
      '<div class="sec-b tight"><pre class="mono xsmall" style="margin:0;max-height:300px;overflow:auto;line-height:1.75;color:var(--fg2)">' +
      esc(tail.join("\n")) + "</pre></div></div>";

    var cl = D.clients || [];
    h += '<div class="sec mt14"><div class="sec-h"><h2>客户端版本</h2><span class="n">' + cl.length + " 台</span></div>" +
      '<div class="sec-b tight"><table class="tbl compact"><thead><tr><th>机场</th><th>客户端</th><th>本地版本</th><th>最新</th><th>状态</th><th>节点</th></tr></thead><tbody>';
    cl.forEach(function (c) {
      var lag = c.latest_ver && c.local_ver && c.latest_ver !== c.local_ver;
      h += '<tr><td class="nm" title="' + esc(c.slug) + '">' + esc(nmBySlug(c.slug)) + "</td><td>" + esc(c.client || "—") + "</td>" +
        '<td class="mono">' + esc(c.local_ver || "—") + "</td>" +
        '<td class="mono ' + (lag ? "" : "dim") + '">' + esc(c.latest_ver || "—") + "</td>" +
        "<td>" + pill(lag ? "pill b" : "pill", lag ? "可升级" : esc(c.status || "—")) + "</td>" +
        '<td class="xsmall dim">' + esc((c.node_pull || "").slice(0, 40)) + "</td></tr>";
    });
    h += "</tbody></table></div></div>";

    var raws = (D.airports || []).filter(function (a) { return a.raw && a.raw.at; })
      .sort(function (a, b) { return String(b.raw.at).localeCompare(String(a.raw.at)); });
    h += '<div class="sec mt14"><div class="sec-h"><h2>订阅原文存档</h2><span class="n">' + raws.length + " 家 · 正文含凭据，只在此处显示元信息</span></div>" +
      '<div class="sec-b tight">';
    if (!raws.length) {
      h += '<span class="dim small">还没有存档：订阅型机场每次拉取都会把原始响应存到 data/subraw/&lt;机场&gt;/（每台保留最近 30 份）。</span>';
    } else {
      h += '<table class="tbl compact"><thead><tr><th>机场</th><th>最近一份</th><th>格式</th><th class="r">大小</th><th>通道</th><th></th></tr></thead><tbody>';
      raws.forEach(function (a) {
        var kb = a.raw.bytes ? (a.raw.bytes / 1024).toFixed(1) + " KB" : "—";
        h += '<tr><td class="nm">' + esc(nmOf(a)) + "</td>" +
          '<td class="mono xsmall">' + esc(shortTime(a.raw.at)) + "</td>" +
          '<td class="mono xsmall">' + esc(a.raw.ext || "—") + "</td>" +
          '<td class="r mono xsmall">' + kb + "</td>" +
          '<td class="xsmall dim">' + esc(a.raw.via || "—") + "</td>" +
          '<td class="r"><button class="btn ghost xs raws" data-slug="' + esc(a.slug) + '">看原文</button></td></tr>';
      });
      h += "</tbody></table></div></div>";
    }

    v.innerHTML = h;
    $$("button.raws").forEach(function (b) {
      b.addEventListener("click", function () {
        var slug = b.getAttribute("data-slug");
        b.textContent = "读取中…";
        fetch("api/raw/" + encodeURIComponent(slug) + "?limit=300000", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            b.textContent = "看原文";
            if (!j.ok) { toast(j.error || "读取失败"); return; }
            var m = j.meta || {};
            openModal("订阅原文 · " + slug + " · " + (m.at || "") + " · " + (m.bytes ? (m.bytes / 1024).toFixed(1) + " KB" : ""), j.text || "");
          })
          .catch(function () { b.textContent = "看原文"; toast("预览服务未启动或不可达"); });
      });
    });
    $$("#runsTbl .rrow").forEach(function (tr) {
      tr.addEventListener("click", function () {
        var i = tr.getAttribute("data-i");
        var d = $("#runsTbl").querySelector('.rdet[data-i="' + i + '"]');
        if (d) d.style.display = d.style.display === "none" ? "" : "none";
      });
    });
  }

  /* ------------------------------------------------------------ 弹窗与轻提示 */
  function toast(msg) {
    var t = $("#toast");
    if (!t) return;
    t.textContent = msg;
    t.className = "on";
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.className = ""; }, 3400);
  }

  function openModal(title, text) {
    $("#mdlT").textContent = title || "";
    $("#mdlB").textContent = text || "";
    $("#mdl").classList.add("on");
  }

  function closeModal() {
    $("#mdl").classList.remove("on");
  }

  function initModal() {
    var x = $("#mdlX"), m = $("#mdl");
    if (x) x.addEventListener("click", closeModal);
    if (m) m.addEventListener("click", function (e) { if (e.target === m) closeModal(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeModal();
    });
  }

  /* ------------------------------------------------------------ 右栏待办 */
  function renderRail() {
    var acts = (D.actions || []);
    var h = "";
    acts.forEach(function (a) {
      var cls = stCls(a.state);
      h += '<div class="act" data-slug="' + esc(a.slug) + '">' +
        '<i class="rd" style="background:' + ({ ok: "#35d08a", b: "#f2b33d", c: "#5c8bff", d: "#f0555c" }[cls] || "#757d8d") + '"></i>' +
        '<div><div class="t1">' + esc(nmOf(a)) + '<span class="d">' + esc(stName(a.state)) +
        (a.days != null ? " · " + (a.days < 0 ? "过期" + (-a.days) + "天" : a.days + "天") : "") + "</span></div>" +
        '<div class="t2">' + esc(a.reason || "—") + "</div>" +
        (a.action ? '<div class="t3">' + esc(a.action) + "</div>" : "") +
        "</div></div>";
    });
    if (!h) h = '<div class="act"><div></div><div class="t2">本轮没有需要人工介入的项。</div></div>';
    $("#actList").innerHTML = h;
    $("#actN").textContent = acts.length + " 项";
    $$("#actList .act").forEach(function (n) {
      n.addEventListener("click", function () { openDrawer(n.getAttribute("data-slug")); });
    });
  }

  /* ------------------------------------------------------------ 抽屉 */
  function openDrawer(slug) {
    var a = bySlug[slug];
    if (!a) return;
    $("#drTitle").innerHTML = esc(nmOf(a)) + enSuffix2(a);
    $("#drSub").textContent = (a.type === "client" ? "客户端型" : "订阅型") + " · " + stName(a.state) +
      (a.panel ? " · " + a.panel : "");

    var used = (a.total_gb != null && a.used_pct != null) ? Math.round(a.total_gb * a.used_pct / 100) : null;
    var kv = [
      ["状态", dot(stCls(a.state)) + " " + stName(a.state)],
      ["可用节点", num(a.nodes) + (a.frag ? " 条（另有 " + num(a.frag) + " 条无协议碎片）" : " 条") + " · 可导出 " + num(a.exported)],
      ["获取方式", esc(a.via || "—")],
      ["套餐到期", esc(a.expire || "—") + (a.days != null ? "（" + esc(daysText(a.days)) + "）" : "")],
      ["流量", a.unlimited ? "不限量" : (a.total_gb != null ? num(used) + " / " + num(a.total_gb) + " GB（" + (a.used_pct || 0) + "%）" : "—")],
      ["最近成功", '<span id="apLastOk">' + esc(relTime(a.last_ok)) + "</span>"],
      ["快照年龄", a.stale_h != null ? a.stale_h + " 小时" : "—"],
      ["30 天稳定", a.stability != null ? a.stability + "%" : "—"],
      ["累计波动", num(a.churn || 0)],
      ["落地机房", esc(a.rdap_org || "—") + (a.rdap_share != null ? "（" + Math.round(a.rdap_share * 100) + "%）" : "")],
      ["承载/CDN", infraText(a)],
      ["IDC 特征", a.idc_score != null ? a.idc_score + " · " + esc(a.idc_level || "") : "—"],
      ["探活", a.probe_ok != null ? a.probe_ok + " 通 / " + a.probe_fail + " 失败" : "—"],
      ["客户端", a.client ? esc(a.client) + " v" + esc(a.client_local || "?") + (a.client_latest ? " → " + esc(a.client_latest) : "") : "—"],
      ["订阅入口", (function () {
        var pk = (a.proxy && a.proxy.sub) || "";
        if (!pk) return a.has_sub ? "—" : "无订阅（客户端型）";
        var map = {
          direct: ["直连即可", "var(--green)"],
          both: ["直连/代理均可", "var(--green)"],
          proxy: ["需代理", "var(--amber)"],
          direct_fail: ["直连不通 · 需代理", "var(--amber)"],
          none: ["直连与代理都不通", "var(--red)"]
        };
        var m2 = map[pk] || [pk, ""];
        return '<span style="color:' + m2[1] + '">' + esc(m2[0]) + "</span>";
      })()],
      ["面板", esc(a.panel || "—")],
      ["域名", (a.domains || []).length ? esc((a.domains || []).join("、")) : "—"]
    ];

    var h = "";

    /* 机场信息（面板 / 订阅链接 / 客户端），数据来自本地预览后端 */
    h += '<div class="sub-h">机场信息</div>' +
      '<div class="apwrap" id="apInfo"><div class="aprow"><div class="apk">读取中</div>' +
      '<div class="apv dim" id="apInfoMsg">正在向本地预览服务取面板与订阅…</div></div></div>';

    /* 获取节点：真跑 run.py pull --airport <slug> */
    h += '<div class="sub-h">获取节点</div>' +
      '<div class="row" style="gap:8px;align-items:center">' +
      '<button class="btn primary" id="apFetch">获取节点</button>' +
      '<span class="small dim" id="apFetchMsg"></span></div>' +
      '<div class="logbox" id="apLog" style="display:none"></div>';

    /* 原始文件：订阅下载下来那一坨 / 我们解析后的快照 / 导出配置，都打码后可看 */
    h += '<div class="sub-h">原始文件</div>' +
      '<div class="row wrap" style="gap:8px">' +
      '<button class="btn xs" id="apFileRaw">订阅原文</button>' +
      '<button class="btn xs" id="apFileSnap">解析后快照</button>' +
      '<button class="btn xs" id="apFileYaml">导出配置</button>' +
      '<span class="small dim">密码/uuid/令牌已打码</span></div>';

    if (a.sub_closed && a.sub_closed.at) {
      var auto = a.sub_auto && a.sub_auto.ok
        ? "下一次拉取会自动开启（面板令牌剩 " + num(a.sub_auto.hours) + " 小时）"
        : "面板令牌已过期或未配置 —— 去面板点「开启订阅」，再复制 localStorage 的 pu:auth 填到 credentials.yaml";
      kv.unshift(["订阅状态", '<span class="bad">关闭中（' + esc(a.sub_closed.at) + "）</span> · " + auto]);
    }
    if (a.sub_auto && a.sub_auto.ok) {
      kv.unshift(["面板令牌", num(a.sub_auto.hours) + " 小时后过期" +
        (a.sub_auto.hours < 48 ? ' · <span class="bad">快过期了，记得重新复制</span>' : "")]);
    }
    h += '<dl class="kv">';
    kv.forEach(function (p) { h += "<dt>" + p[0] + "</dt><dd>" + p[1] + "</dd>"; });
    h += "</dl>";

    if (a.reason) {
      h += '<div class="sub-h">本轮判定</div><div class="small fg2">' + esc(a.reason) + "</div>";
    }
    if (a.action) {
      h += '<div class="sub-h">需要你做什么</div><div class="small" style="color:var(--teal)">' + esc(a.action) + "</div>";
    }

    /* 协议分布 */
    var pr = a.protos || {};
    var pk = Object.keys(pr);
    if (pk.length) {
      var tot = pk.reduce(function (s, k) { return s + pr[k]; }, 0) || 1;
      h += '<div class="sub-h">节点协议</div><div class="row wrap" style="gap:6px">';
      pk.sort(function (x, y) { return pr[y] - pr[x]; }).forEach(function (k) {
        h += '<span class="pill"><i class="dotc" style="background:' + protoColor(k) + '"></i>' + esc(k) + " " + pr[k] + " · " + pct(pr[k], tot) + "%</span>";
      });
      h += "</div>";
    }

    /* 已知域名全集 */
    var doms = a.doms_all || [];
    if (doms.length) {
      h += '<div class="sub-h">已知域名（' + doms.length + ' 个 · 当前可打开 ' + (a.doms_alive || 0) + ' 个）</div>';
      h += '<div class="nodewrap"><table class="tbl compact nodetbl domtbl"><thead><tr>' +
        '<th>域名</th><th class="thc">状态</th><th>标题 / 来源</th></tr></thead><tbody>';
      doms.forEach(function (x) {
        var alive = x.c === 200;
        var code = alive ? "200" : (x.c === "不通" ? "不通" : String(x.c));
        var srcs = (x.s || []).join(" · ");
        h += "<tr>" +
          '<td class="mono xsmall"><a class="link" href="' + (alive ? "https://" + esc(x.d) : "#") + '"' +
          (alive ? ' target="_blank" rel="noreferrer"' : "") + ">" + esc(x.d) + "</a></td>" +
          '<td class="xsmall thc ' + (alive ? "okc" : "dim") + '">' + esc(code) + "</td>" +
          '<td class="xsmall dim">' + (x.t ? esc(x.t) + (srcs ? " — " : "") : "") + esc(srcs) + "</td>" +
          "</tr>";
      });
      h += "</tbody></table></div>";
    } else {
      h += '<div class="sub-h">已知域名</div><div class="small dim">还没有收录到这家除面板以外的域名。</div>';
    }

    /* 最近告警 */
    var al = (D.alerts || []).filter(function (x) { return x.slug === slug; }).slice(-6).reverse();
    if (al.length) {
      h += '<div class="sub-h">最近事件</div><div class="small">';
      al.forEach(function (x) {
        h += '<div class="row" style="gap:8px;padding:3px 0"><span class="mono xsmall dim" style="width:86px">' +
          esc(shortTime(x.ts)) + "</span><span class=\"fg2\">" + esc(x.lines.join(" · ").slice(0, 90)) + "</span></div>";
      });
      h += "</div>";
    }

    /* IP 与归属：一个机场解析出的全部地址（含 GeoDNS 海外视角补充） */
    var iprows = a.ips || [];
    if (iprows.length) {
      var altN = 0;
      iprows.forEach(function (r) { if (r[6]) altN++; });
      h += '<div class="sub-h">IP 与归属（' + iprows.length + " 个地址" +
        (altN ? '，其中 ' + altN + " 个只在海外 DNS 可见" : "") + "，按承载节点数排序）</div>";
      h += '<div class="nodewrap"><table class="tbl compact nodetbl"><thead><tr>' +
        '<th>解析 IP</th><th>netname</th><th>机构 / 运营方</th><th>国家/地区</th><th>ASN</th>' +
        '<th class="num">承载节点</th><th>线路视角</th></tr></thead><tbody>';
      iprows.forEach(function (r) {
        var alt = r[6];
        h += "<tr><td class=\"mono xsmall\">" + esc(r[0]) + "</td>" +
          '<td class="mono xsmall dim">' + esc(r[1] || "—") + "</td>" +
          '<td class="xsmall">' + esc(r[2] || "—") + "</td>" +
          '<td class="xsmall dim">' + esc(r[3] || "—") + "</td>" +
          '<td class="mono xxsmall dim">' + esc(r[5] || "—") + "</td>" +
          '<td class="num mono xsmall">' + num(r[4] || 0) + "</td>" +
          "<td>" + (alt ? '<span class="ipalt">海外独有</span>' : '<span class="xsmall dim">国内可见</span>') + "</td></tr>";
      });
      h += "</tbody></table></div>" +
        '<div class="xsmall dim" style="margin:4px 0 10px">' +
        "同一个域名问不同 DNS 会得到不同 A 记录（GeoDNS 分线）：国内 DNS 给一组国内落地，" +
        "「海外独有」那几条只有问 1.1.1.1 才出现。<b>这些 IP 全是入口</b>——你连它，它再转到落地，" +
        "出口 IP 订阅里不会给（见 docs/20 实测：7 条样本 0 条入口=出口）。" +
        "本表只讲解析与归属，<b>不代表这些 IP 此刻能不能连</b>；连通性看下方节点的探活（按机场抽 5 个节点测 TCP）。</div>";
    }

    /* 节点全量 */
    var rows = a.node_rows || [];
    if (rows.length) {
      var pc = {};
      rows.forEach(function (r) { pc[r[1]] = (pc[r[1]] || 0) + 1; });
      h += '<div class="sub-h">节点（全部 ' + rows.length + ' 条）</div>';
      h += '<div class="nodewrap"><table class="tbl compact nodetbl"><thead><tr>' +
        '<th class="nm">名称</th><th>协议</th><th>地址</th><th>解析 IP</th><th>归属</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        var own = r[6] || r[5] || "—";
        var hot2 = own.indexOf("华为") === 0 ? ' class="hot"' : "";
        var ip = r[7] || "";
        var nip = r[8] || 0;
        var ipCell = ip
          ? esc(ip) + (nip > 1 ? ' <span class="ipmore">+' + (nip - 1) + "</span>" : "")
          : "未解析";
        h += '<tr><td class="nm xsmall">' + esc(r[0] || "—") + '</td><td class="xsmall nowrap"><i class="dotc" style="background:' +
          protoColor(r[1]) + ';margin-right:5px"></i>' + esc(r[1]) + '</td><td class="mono xsmall dim">' + esc(r[2]) + ":" + (r[3] || "") +
          '</td><td class="mono xsmall' + (ip ? "" : " dim") + '">' + ipCell + '</td><td class="xsmall dim"' + hot2 + ">" + esc(own) + "</td></tr>";
      });
      h += "</tbody></table></div>";
    } else {
      h += '<div class="sub-h">节点</div><div class="small dim">这家当前没有可用快照节点。</div>';
    }


    $("#drBody").innerHTML = h;
    $("#dr").classList.add("on");
    $("#bd").classList.add("on");

  function infraText(a) {
    var arr = a.infra || [];
    if (!arr.length) return "—";
    var tot = 0;
    arr.forEach(function (x) { tot += x[1]; });
    if (!tot) return "—";
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var nm = arr[i][0], n = arr[i][1];
      var hot = nm.indexOf("华为") === 0 ? ' class="hot"' : "";
      out.push("<span" + hot + ">" + esc(nm) + " " + Math.round(n / tot * 100) + "%</span>");
    }
    return out.join(" · ");
  }

var API = { ok: false, reason: "" };

  function probeApi() {
    return fetch("api/status", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        API.ok = true;
        return r.json().then(function (j) {
          API.wd = j.watchdog || null;
          API.proxy = j.proxy !== false;
          API.round = j;
          /* 定时轮收尾后 last_run.ended_at 会变：数据自己刷新，不用手动 F5 */
          var sig = String(j.started_at || "") + "|" + String(j.ended_at || "") + "|" + String(j.nodes_total || "");
          if (API.sig && API.sig !== sig) {
            reloadData().then(function (ok) {
              if (ok && typeof toast === "function") {
                toast("检测到新一轮跑完（" + (j.nodes_total == null ? "—" : j.nodes_total) + " 个节点），已自动刷新");
              }
            });
          }
          API.sig = sig;
          if (S.view === "run" && RENDER.run) RENDER.run();
        }).catch(function () {});
      })
      .catch(function () {
        API.ok = false;
        API.reason = "本地预览服务未启动（用 python tools/panel_preview_server.py 打开本页才有）";
      });

  /* 复制到剪贴板：沙箱 iframe 里 navigator.clipboard 常被拒（NotAllowedError），
     逐级降级 -> execCommand("copy") -> 选中文本让用户按 Ctrl+C。 */
  function copyText(text, done) {
    function legacy() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }
    try { window.focus(); } catch (e) {}
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { done("ok"); },
        function () { done(legacy() ? "ok" : "manual"); }
      );
    } else {
      done(legacy() ? "ok" : "manual");
    }
  }

  /* 复制失败时把全文露出并整段选中，用户按 Ctrl+C 即可 */
  function selectSubText(text) {
    var el = $("#apSubVal");
    if (!el) return;
    el.textContent = text;
    try {
      var r = document.createRange();
      r.selectNodeContents(el);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    } catch (e) {}
  }

  var fetchTimers = {};

  function fetchNodes(slug) {
    var btn = $("#apFetch");
    var msg = $("#apFetchMsg");
    var log = $("#apLog");
    if (!API.ok) { msg.textContent = API.reason; return; }

    // 代理没开：订阅站点基本都会超时，先提醒一次；再点就放行
    if (API.proxy === false && !API.proxyWarned) {
      API.proxyWarned = true;
      msg.innerHTML = '<span style="color:var(--amber)">代理没开（[::1]:7890）</span>' +
        '<span class="dim small"> —— 订阅站点大多在墙外，这次大概率会超时。' +
        '先打开代理客户端，再点一次；或直接再点一次按直连试。</span>';
      return;
    }

    btn.disabled = true;
    msg.innerHTML = '<span class="spin"></span>正在开始…';
    log.style.display = "block";
    log.textContent = "";

    fetch("api/fetch/" + encodeURIComponent(slug), { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error || "启动失败");
        pollFetch(slug);
      })
      .catch(function (e) {
        btn.disabled = false;
        msg.textContent = "";
        log.textContent = "无法开始：" + e.message;
        log.className = "logbox";
      });
  }

  function pollFetch(slug) {
    var log = $("#apLog");
    var msg = $("#apFetchMsg");
    var btn = $("#apFetch");
    apiGet("api/fetch/" + encodeURIComponent(slug)).then(function (j) {
      if (j.tail && j.tail.length) log.textContent = j.tail.join("\n");
      log.scrollTop = log.scrollHeight;

      if (j.state === "running") {
        var m = (j.mode || "");
        if (j.elevated) {
          msg.innerHTML = '<span class="spin"></span>已请求管理员权限 · 请在弹出的 UAC 窗口点「是」';
        } else if (m.indexOf("scan-memory") === 0) {
          msg.innerHTML = '<span class="spin"></span>正在扫描客户端内存（' + m.replace("scan-memory · ", "") + '）…';
        } else {
          msg.innerHTML = '<span class="spin"></span>正在拉取订阅…';
        }
        clearTimeout(fetchTimers[slug]);
        fetchTimers[slug] = setTimeout(function () { pollFetch(slug); }, 1200);
        return;
      }
      btn.disabled = false;
      if (j.state === "done") {
        if (j.regen === "ok") {
          msg.innerHTML = '<span style="color:var(--green)">完成</span> · 正在更新卡片…';
          reloadData().then(function (ok) {
            if (ok) {
              var a2 = bySlug[slug];
              var okTxt = '<span style="color:var(--green)">完成</span> · 已刷新' +
                (a2 ? "：现在 " + stName(a2.state) + " · " + num(a2.nodes) + " 个节点" : "");
              /* 先重绘抽屉（会重建 msg 元素），再写入提示，否则提示被冲掉 */
              if ($("#dr").classList.contains("on")) openDrawer(slug);
              var m2 = $("#apFetchMsg");
              if (m2) m2.innerHTML = okTxt;
            } else {
              msg.innerHTML = '<span style="color:var(--green)">完成</span> · 数据已重生成，' +
                '<a href="javascript:void 0" id="apReload" style="color:var(--blue)">点这里刷新</a>看最新卡片';
              var rl = $("#apReload");
              if (rl) rl.onclick = function () { location.reload(); };
            }
          });
        } else if (j.regen === "running") {
          msg.innerHTML = '<span style="color:var(--green)">完成</span> · 正在重新生成本页数据…';
          clearTimeout(fetchTimers[slug]);
          fetchTimers[slug] = setTimeout(function () { pollFetch(slug); }, 1500);
          log.className = "logbox";
          loadAirportInfo(slug);
          return;
        } else {
          msg.innerHTML = '<span style="color:var(--green)">完成</span> · 快照已更新（本页数据未重生成，刷新可能仍是旧值）';
        }
        log.className = "logbox";
        loadAirportInfo(slug);
      } else if (j.state === "failed") {
        msg.innerHTML = '<span style="color:var(--red)">失败</span> · 退出码 ' + (j.exit == null ? "?" : j.exit);
        log.className = "logbox bad";
      } else {
        msg.textContent = "";
      }
    }).catch(function () {
      clearTimeout(fetchTimers[slug]);
      btn.disabled = false;
      msg.textContent = "查询任务状态失败";
    });
  }

  /* 拉取成功后热更新：重新取 data.js、重建索引、重绘当前视图。
     这样"更新订阅 → 获取节点成功"就能当场变绿，不用手动刷新整页。 */
  function reloadData() {
    return fetch("data.js?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (txt) {
        if (!txt || txt.indexOf("window.AIRMON") < 0) return false;
        try { new Function(txt)(); } catch (e) { return false; }
        if (!window.AIRMON) return false;
        D = window.AIRMON;
        T = D.totals || {};
        APTS = D.airports || [];
        bySlug = {};
        APTS.forEach(function (a) { bySlug[a.slug] = a; });
        SORTED = APTS.slice().sort(function (x, y) {
          var o = (ORDER[x.state] == null ? 9 : ORDER[x.state]) - (ORDER[y.state] == null ? 9 : ORDER[y.state]);
          return o !== 0 ? o : (y.nodes - x.nodes);
        });
        /* 各视图有 S.drawn 一次性绘制标记，数据变了必须清掉才会真正重绘 */
        S.drawn = {};
        RENDER[S.view]();
        return true;
      })
      .catch(function () { return false; });
  }

      ov: "",
      exp: (T.expired || 0) + " 过期",
      al: (D.alerts || []).length + "",
      hw: (T.hw || 0) + "",
      nd: num(T.nodes),
      lib: APTS.length + "",
      kn: (D.knowledge || []).length + "",
      an: (D.meta.days || 30) + "d",
      run: "1/5"
    };
    $$("[data-k]").forEach(function (n) { n.textContent = K[n.getAttribute("data-k")] || ""; });

    /* 导航 */
    $$(".nav-item").forEach(function (b) {
      b.addEventListener("click", function () { switchView(b.getAttribute("data-view")); });
    });

    /* 搜索 */
    var qEl = $("#q");
    var timer = null;
    qEl.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        S.q = qEl.value.trim();
        RENDER[S.view]();
      }, 160);
    });

    /* 待办按钮 → 右栏 */
    $("#btnAct").addEventListener("click", function () {
      var rail = $(".rail");
      rail.scrollIntoView({ behavior: "smooth", block: "nearest" });
      rail.animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: 300, easing: "ease-out" });
    });

    /* 抽屉关闭 */
    $("#drX").addEventListener("click", closeDrawer);
    $("#bd").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeDrawer();
      if (e.key >= "1" && e.key <= "9" && !/input|textarea/i.test(document.activeElement.tagName)) {
        var order = ["ov", "exp", "al", "hw", "nd", "lib", "kn", "an", "run"];
        switchView(order[+e.key - 1]);
      }
    });

    renderRail();

    /* 深链：#an 之类直接落到对应视图 */
    var hashView = (location.hash || "").replace("#", "");
    switchView(VIEW_META[hashView] ? hashView : "ov");
    window.addEventListener("hashchange", function () {
      var v = (location.hash || "").replace("#", "");
      if (VIEW_META[v] && v !== S.view) switchView(v);
    });
    requestAnimationFrame(function () {
      var on = $(".nav-item.on");
      if (on) moveIndicator(on);
    });
    window.addEventListener("resize", function () {
      var on = $(".nav-item.on");
      if (on) moveIndicator(on);
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
