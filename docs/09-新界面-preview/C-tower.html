<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C · 塔台 — 机场监控台</title>
<style>
  :root{
    --void:#080911; --deck:#0d0f1c; --deck-2:#111428; --edge:#1e2140; --edge-2:#171a33;
    --ink:#e6e8f5; --mut:#9a9ebd; --dim:#7d83ad;
    --violet:#8b7bf7; --mint:#3ee0b0; --amber:#f5b545; --rose:#ff6b8a; --ice:#6ea8ff;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--void); color:var(--ink); overflow:hidden;
    font:13px/1.5 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(ellipse 70% 60% at 46% 52%, #141634 0%, #0a0b16 55%, #07080f 100%);
  }
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .app{display:grid; grid-template-columns:196px 1fr 312px; height:100vh}

  /* 左 */
  .left{padding:24px 18px; border-right:1px solid var(--edge-2); display:flex; flex-direction:column; gap:22px}
  .brand{display:flex; align-items:center; gap:9px}
  .mark{width:20px; height:20px; border-radius:50%; border:1px solid var(--violet); position:relative}
  .mark::after{content:""; position:absolute; inset:5px; border-radius:50%; background:var(--violet); opacity:.55;
    box-shadow:0 0 12px 2px rgba(139,123,247,.55)}
  .brand b{font-size:12.5px; letter-spacing:.18em; font-weight:600}
  .brand i{display:block; font-style:normal; font-size:9.5px; color:var(--dim); letter-spacing:.1em; margin-top:2px}

  .deck{border:1px solid var(--edge); border-radius:9px; padding:11px 12px; background:var(--deck); display:flex; flex-direction:column; gap:7px}
  .deck .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; color:var(--dim)}
  .deck .s{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--amber)}
  .deck .s i{width:5px;height:5px;border-radius:50%;background:currentColor; box-shadow:0 0 8px currentColor}
  .deck .v{font-family:var(--mono); font-size:10px; color:var(--mut)}

  /* 竖向刻度 */
  .ruler{margin-top:6px; flex:1; position:relative; border-left:1px solid var(--edge); margin-left:6px}
  .ruler span{position:absolute; left:0; font-family:var(--mono); font-size:8.5px; color:var(--dim); padding-left:8px}
  .ruler span::before{content:""; position:absolute; left:-1px; top:5px; width:5px; height:1px; background:var(--edge)}
  .ruler .cap{top:auto; bottom:-14px}
  .lr{display:flex; flex-direction:column; gap:1px}
  .lr a{display:flex; justify-content:space-between; padding:5.5px 8px; border-radius:5px; color:var(--mut);
    text-decoration:none; font-size:11.5px}
  .lr a.on{background:var(--deck-2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--edge)}
  .lr a b{font-family:var(--mono); font-size:10px; color:var(--dim); font-weight:400}
  .lr a.on b{color:var(--violet)}

  /* 中央雷达 */
  .stage{position:relative; display:flex; flex-direction:column; min-width:0}
  .stage .head{padding:22px 26px 0; display:flex; align-items:flex-start; justify-content:space-between}
  .stage h1{font-size:17px; font-weight:600; letter-spacing:.01em}
  .stage h1 em{font-style:normal; color:var(--mut); font-weight:400; font-size:12px; margin-left:9px}
  .stamp{font-family:var(--mono); font-size:9.5px; color:var(--dim); text-align:right; line-height:1.8}

  .radar{flex:1; position:relative; display:flex; align-items:center; justify-content:center}
  svg.ring{overflow:visible}
  .core{position:absolute; text-align:center; pointer-events:none}
  .core .n{font-family:var(--mono); font-size:52px; line-height:.92; letter-spacing:-.045em}
  .core .l{margin-top:8px; font-size:10.5px; color:var(--mut); letter-spacing:.16em}
  .core .d{margin-top:5px; font-family:var(--mono); font-size:9.5px; color:var(--dim)}

  .ringlab{position:absolute; font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--dim)}
  .rl-a{left:50%; top:26px; transform:translateX(-50%)}
  .rl-b{bottom:20px; left:50%; transform:translateX(-50%)}

  .strip{display:flex; align-items:center; justify-content:space-between; padding:10px 26px 16px; border-top:1px solid var(--edge-2); gap:18px}
  .strip .item{flex:1}
  .strip .k{font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--dim); margin-bottom:4px}
  .strip .v{font-family:var(--mono); font-size:15px}
  .strip .v s{text-decoration:none; font-size:10px; color:var(--dim); margin-left:4px}

  /* 右 */
  .right{border-left:1px solid var(--edge-2); padding:22px 20px; display:flex; flex-direction:column; gap:16px; background:#090a13}
  .gauges{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .g{border:1px solid var(--edge); border-radius:9px; padding:11px 10px 9px; background:var(--deck); text-align:center}
  .g svg{display:block; margin:0 auto}
  .g .l{margin-top:6px; font-size:10px; color:var(--mut)}

  .gh{font-size:11px; font-weight:600; letter-spacing:.02em; display:flex; justify-content:space-between; align-items:baseline}
  .gh span{font-family:var(--mono); font-size:9.5px; color:var(--rose)}
  .list{display:flex; flex-direction:column}
  .li{display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid var(--edge-2)}
  .li .sq{width:6px;height:6px;border-radius:1.5px; flex:0 0 6px}
  .li .nm{font-size:11.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .li .v{font-family:var(--mono); font-size:10.5px; color:var(--mut)}
  .li .v.bad{color:var(--rose)}

  .legend{display:flex; flex-wrap:wrap; gap:5px 13px; font-size:10.5px; color:var(--mut)}
  .legend i{display:inline-block; width:5px; height:5px; border-radius:50%; margin-right:5px; vertical-align:1px}

  .foot{margin-top:auto; font-family:var(--mono); font-size:10.5px; color:var(--mut); line-height:1.85; letter-spacing:.04em}
</style>
</head>
<body>
<div class="app">
  <!-- 左 -->
  <aside class="left">
    <div class="brand"><div class="mark"></div><div><b>AIRMON</b><i>机场监控塔台</i></div></div>

    <div class="deck">
      <div class="k">CYCLE</div>
      <div class="s"><i></i><span id="runS">进行中 1/5</span></div>
      <div class="v" id="runT">—</div>
    </div>

    <div class="deck" style="gap:5px">
      <div class="k">SUPPLY</div>
      <div class="v">节点 <span style="color:var(--ink)" id="l-nodes">—</span></div>
      <div class="v">可导出 <span style="color:var(--ink)" id="l-exp">—</span></div>
      <div class="v">覆盖 <span style="color:var(--ink)" id="l-cov">—</span></div>
    </div>

    <div class="ruler" id="ruler">
      <span style="top:0">100</span>
      <span style="top:25%">75</span>
      <span style="top:50%">50</span>
      <span style="top:75%">25</span>
      <span style="top:calc(100% - 14px)">0</span>
    </div>

    <div class="lr">
      <a class="on">塔台<b>47</b></a>
      <a>到期<b id="n-exp">5</b></a>
      <a>告警<b>120</b></a>
      <a>华为云<b>0</b></a>
      <a>分析<b>30d</b></a>
    </div>

    <div class="foot">3H CYCLE<br>47 AIRPORTS<br><span id="f-base">—</span></div>
  </aside>

  <!-- 中央 -->
  <main class="stage">
    <div class="head">
      <h1>供给态势<em>每家一个点位，越亮节点越多</em></h1>
      <div class="stamp"><div id="s-base">—</div><div>30 DAY WINDOW</div></div>
    </div>

    <div class="radar">
      <div class="ringlab rl-a">INNER · 可用 34</div>
      <svg class="ring" id="ring" width="560" height="560" viewBox="0 0 560 560"></svg>
      <div class="core">
        <div class="n" id="c-nodes">2310</div>
        <div class="l">节点在册</div>
        <div class="d" id="c-sub">47 家机场 · 41 家有节点</div>
      </div>
      <div class="ringlab rl-b">OUTER · 异常 13</div>
    </div>

    <div class="strip">
      <div class="item"><div class="k">协议主力</div><div class="v" id="p-top">—</div></div>
      <div class="item"><div class="k">地区集中</div><div class="v" id="g-top">—</div></div>
      <div class="item"><div class="k">最大换血</div><div class="v" id="ch-top">—</div></div>
      <div class="item"><div class="k">最弱稳定</div><div class="v" id="st-top">—</div></div>
    </div>
  </main>

  <!-- 右 -->
  <aside class="right">
    <div class="gauges" id="gauges"></div>

    <div>
      <div class="gh">断流 · 过期<span id="g-badn">—</span></div>
      <div class="list" id="badlist"></div>
    </div>

    <div class="legend" id="legend"></div>

    <div class="foot">
      订阅直取 31 · 客户端内核 9 · 内存扫描 7<br>
      过期仍出节点 2 家 · 需人工 7 家
    </div>
  </aside>
</div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.DATA, K = D.kpis, $ = function(i){ return document.getElementById(i); };
  var fmt = function(n){ return (n||0).toLocaleString('en-US'); };
  var SVGNS = 'http://www.w3.org/2000/svg';
  var C = {A:'#3ee0b0', B:'#f5b545', C:'#6ea8ff', D:'#ff6b8a'};
  var el = function(t, a){ var e = document.createElementNS(SVGNS, t); for (var k in a) e.setAttribute(k, a[k]); return e; };

  $('c-nodes').textContent = fmt(K.nodes);
  $('c-sub').textContent = K.airports + ' 家机场 · ' + K.airports_with_nodes + ' 家有节点';
  $('l-nodes').textContent = fmt(K.nodes);
  $('l-exp').textContent = fmt(K.exported);
  $('l-cov').textContent = K.airports_with_nodes + '/' + K.airports;
  $('n-exp').textContent = K.expired;
  $('s-base').textContent = 'DATA ' + (D.meta.generated || '—');
  $('f-base').textContent = D.meta.generated || '—';
  $('runS').textContent = (D.meta.run_status === 'running' ? '进行中 ' : '完成 ') + (D.meta.run_step || '');
  $('runT').textContent = D.meta.run_started || '';

  /* ---- 雷达：三层环 ---- */
  var svg = $('ring'), CX = 280, CY = 280;
  var rings = [{r:150, c:'A'}, {r:205, c:'BC'}, {r:255, c:'D'}];
  rings.forEach(function(g){
    svg.appendChild(el('circle', {cx:CX, cy:CY, r:g.r, fill:'none', stroke:'#1e2140', 'stroke-width':1}));
  });
  // 十字与刻度
  svg.appendChild(el('line', {x1:CX, y1:CY-270, x2:CX, y2:CY+270, stroke:'#151830', 'stroke-width':1}));
  svg.appendChild(el('line', {x1:CX-270, y1:CY, x2:CX+270, y2:CY, stroke:'#151830', 'stroke-width':1}));
  // 外圈刻度
  for (var i = 0; i < 72; i++) {
    var ang = i * 5 * Math.PI / 180, big = i % 6 === 0;
    var r1 = 268, r2 = big ? 258 : 263;
    svg.appendChild(el('line', {
      x1: CX + Math.sin(ang) * r1, y1: CY - Math.cos(ang) * r1,
      x2: CX + Math.sin(ang) * r2, y2: CY - Math.cos(ang) * r2,
      stroke: big ? '#2b2f55' : '#1b1e3a', 'stroke-width': 1
    }));
  }

  var groups = {A: [], BC: [], D: []};
  D.airports.forEach(function(a){
    var g = a.state === 'A' ? 'A' : (a.state === 'D' ? 'D' : 'BC');
    groups[g].push(a);
  });

  function plot(list, radius, color){
    var n = list.length || 1;
    list.forEach(function(a, i){
      var ang = (i / n) * Math.PI * 2 - Math.PI / 2 + (radius * 0.013);
      var x = CX + Math.cos(ang) * radius, y = CY + Math.sin(ang) * radius;
      var rr = Math.max(2.4, Math.min(7.2, 2.2 + Math.sqrt(a.nodes) * 0.22));
      var c = color || C[a.state];
      if (a.nodes) {
        svg.appendChild(el('circle', {cx:x, cy:y, r:rr + 4, fill:c, opacity:.10}));
        svg.appendChild(el('circle', {cx:x, cy:y, r:rr, fill:c, opacity:.92}));
      } else {
        svg.appendChild(el('circle', {cx:x, cy:y, r:2.6, fill:'none', stroke:c, 'stroke-width':1.2, opacity:.55}));
      }
    });
  }
  plot(groups.A, 150, null);
  plot(groups.BC, 205, null);
  plot(groups.D, 255, null);

  /* ---- 四个仪表 ---- */
  function gauge(val, max, color, label, sub){
    var pct = Math.max(0, Math.min(1, val / max)), R = 30, CIRC = 2 * Math.PI * R;
    return '<div class="g"><svg width="76" height="76" viewBox="0 0 76 76">' +
      '<circle cx="38" cy="38" r="' + R + '" fill="none" stroke="#1e2140" stroke-width="5"/>' +
      '<circle cx="38" cy="38" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="5" stroke-linecap="round"' +
        ' stroke-dasharray="' + (CIRC * pct).toFixed(1) + ' ' + CIRC.toFixed(1) + '"' +
        ' transform="rotate(-90 38 38)" opacity=".9"/>' +
      '<text x="38" y="40" text-anchor="middle" font-size="15" font-family="Consolas,monospace" fill="#e6e8f5">' + sub + '</text>' +
      '</svg><div class="l">' + label + '</div></div>';
  }
  $('gauges').innerHTML =
    gauge(K.ok, K.airports, C.A, '可用率', K.ok) +
    gauge(K.exported, K.nodes, C.C, '可导出占比', Math.round(K.exported / K.nodes * 100) + '%') +
    gauge(K.expired, K.airports, C.D, '套餐已过期', K.expired) +
    gauge(K.airports_with_nodes, K.airports, '#8b7bf7', '有节点覆盖', K.airports_with_nodes);

  /* ---- 断流清单 ---- */
  var bad = D.airports.filter(function(a){ return a.state === 'D'; });
  $('g-badn').textContent = bad.length + ' 家';
  $('badlist').innerHTML = bad.map(function(a){
    var v = (a.days !== null && a.days < 0) ? '过期 ' + Math.abs(a.days) + 'd' : (a.nodes ? a.nodes + 'n' : '0');
    return '<div class="li"><i class="sq" style="background:' + C.D + '"></i>' +
      '<span class="nm">' + a.name + '</span><span class="v bad">' + v + '</span></div>';
  }).join('');

  /* ---- 图例 ---- */
  $('legend').innerHTML = [
    ['A', '可用 ' + K.ok], ['B', '订阅失效 ' + K.subfail], ['C', '仅客户端 ' + K.clientonly], ['D', '断流 ' + K.down]
  ].map(function(x){
    return '<span><i style="background:' + C[x[0]] + '"></i>' + x[1] + '</span>';
  }).join('');

  /* ---- 底部条 ---- */
  $('p-top').innerHTML = D.protos.slice(0, 3).map(function(p){ return p[0] + ' ' + fmt(p[1]); }).join('<s>·</s>');
  $('g-top').innerHTML = D.geos.slice(0, 3).map(function(p){ return p[0] + ' ' + fmt(p[1]); }).join('<s>·</s>');
  $('ch-top').innerHTML = D.churn.slice(0, 2).map(function(c){ return c.name + ' ' + fmt(c.n); }).join('<s>·</s>');
  $('st-top').innerHTML = D.stability.slice(0, 2).map(function(s){ return s.name + ' ' + s.pct + '%'; }).join('<s>·</s>');
})();
</script>
</body>
</html>
