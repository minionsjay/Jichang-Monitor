  homepage: https://www.velochronnet.com
  panel: https://api.9aero.com
  domains:
  - velochronnet.com
  - 9aero.com
  - velochron.com
  client:
    core_process: nanocore
    install_dir: C:\Program Files\Velochron
    package: Velochron
    dpapi_file: C:\Users\minions\AppData\Local\Velochron\secure_store\secure_sub_config_active_a_v2.bin
    dpapi_stale_hours: 48
  notes: 'Velochron.exe+nanocore.exe双进程(nanocore是常驻服务)。v2board API+硬件设备认证

    (device/attest: server/fetch只给元数据, subscribe_url对非认证客户端404)。

    解决: 客户端刷新订阅后缓存完整aero_v2节点配置到 secure_store/*.bin, 仅DPAPI

    (CurrentUser)加密 → airmon/dpapi.py 同用户直接解密(2026-09-16实测33节点全量,

    含psk/aead_key/transport)。无需启动客户端、无需管理员。

    客户端打不开问题: app signature not trusted → 从velochronnet.com重装后已恢复

    (win_bundle_sig_cache_v1 正常, app_signature_policy windows:false)。'
