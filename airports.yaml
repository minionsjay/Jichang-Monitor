# 机场注册表 —— 后续新增机场只在此追加条目
# type: direct  = 直连订阅型（有可直抓的订阅 URL）
# type: client  = 客户端锁定型（订阅接口签名，靠常驻官方客户端落盘）

airports:
  - name: muniu
    display: 牧牛 / V-Ninja
    type: client
    enabled: true
    homepage: https://xn--11xxa.com
    panel: https://muniu.app/user
    domains: [muniu.pro, muniu.go26.one, 牧牛.com]
    subscription:
      # 客户端锁定：直抓一律 403，由常驻客户端落盘明文 profile
      url: https://45.137.181.128/777/ninja/R1xD07bkFwa7ys94
      drop_dir: null        # 常驻客户端的 profiles 目录，部署阶段3时填
      user_agent: Clash V-Ninja
    client:
      package: V-Ninja
      # 安装包样本（阶段2 静态拆包扫华为字符串用）
      sample: ../0701-muniu/V-Ninja-2.3.1-1.x86_64.rpm
