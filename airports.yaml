  # ---- Windows 客户端型（配置加密的 FlClash 变种）----

  - name: wandacloud
    display: 万达云
    type: client           # 客户端锁定型：订阅服务器对非官方客户端返回占位节点
    enabled: true
    homepage: https://wandayun.com
    panel: https://521wdy.xiongmao139.cn
    domains: [wandayun.com, wdy66.cn, wdyserver.com, wdycenter.com]
    subscription:
      # 订阅服务器检测 UA 后返回占位节点(1.1.1.1)，只对官方客户端返回真实节点
      url: https://sub0530.wdyserver.com/cgi-bin/get/api/domain/ip/access?token=fee741b20197c503941a4f29c907e36c
      user_agent: ClashMeta/1.18.0
    client:
      package: wandacloud
      install_dir: "E:\梯子工具\wandacloud"
      # AppData 数据目录（加密的 config.yaml / database.sqlite / shared_preferences.json）
      data_dir: "C:\Users\minions\AppData\Roaming\wandacloud\wandacloud"
      # 核心进程名（用于内存扫描和网络监控）
      core_process: wandacloudCore
    notes: |
      基于 FlClash2026 的修改版，配置文件加密。
      代理服务器: fl0506.wdy66.cn → 120.233.118.86 (中国移动广州)，90个端口(9101-9211)。
      中转: 116.205.40.114 (华为云北京)、120.240.42.49/50 (移动广州)。
      API: v2board 风格 /api/v1/，auth_data 作为 Authorization header。
      采集方式: scan-win-client + scan-memory(管理员) + monitor-net。

  - name: speedcat
    display: SpeedCat
    type: client           # 客户端锁定型：订阅服务器有阿里云 WAF 验证码
    enabled: true
    homepage: https://speedcat.la
    panel: https://scesa.apiv2.a047.com
    domains: [speedcat.la, a047.com, ak005.com, llguanglisf.com]
    subscription:
      # 订阅 URL 被阿里云 WAF 拦截(滑动验证码)，无法直抓
      url: https://scesa.web.ak005.com/api/v1/client/subscribe?token=WE4pMJx1amZEhLjN
      user_agent: clash.meta
    client:
      package: SpeedCat
      install_dir: "E:\梯子工具\SpeedCat"
      data_dir: "C:\Users\minions\AppData\Roaming\SpeedCat\SpeedCat"
      core_process: SpeedCatCore
    notes: |
      基于 FlClash2026 的修改版，配置文件加密。
      代理服务器: allapp5p-mdeyq1olf6.llguanglisf.com → 18.141.233.200 (AWS新加坡)，
      74个端口(10201-10300)；3.115.10.176 (AWS东京)；103.236.77.15 (电信北京)。
      Clash API secret: advantage (external-controller 在 patch 中设为空)。
      采集方式: scan-win-client + scan-memory(管理员) + monitor-net。
