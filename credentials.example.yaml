# ============================================================
# 机场凭证文件 —— 所有机场的账号信息都填这一个文件
# 复制为 credentials.yaml 再填。credentials.yaml 只存本地，勿提交/外传。
# 填完统一跑：  python3 run.py pull
# ============================================================
#
# 每个机场按它的类型，填对应字段（四选一）：
#
#  【类型1】标准 v2board / SSPanel（多数机场）
#     只需账号密码。若所有机场同一个邮箱密码，只填下面 defaults，机场留 {} 即可。
#     后台域名会自动发现，一般不用填 panel。
#
#  【类型2】反爬 Turnstile / 有订阅链接（如 speedcat/fastlink）
#     登录后复制"一键订阅/复制订阅地址"的链接，填 sub_url。
#
#  【类型3】JS 弹窗节点页、无订阅链接（如 ayucloud）
#     浏览器 F12→Network→任一已登录请求→复制 Cookie，填 cookie + base(后台域名)。
#
#  【类型4】V-Ninja 私有协议 / 客户端锁定（如 muniu 隐藏池）
#     不在这里填。装官方客户端登录后，用 watch / ingest-profile 读落盘。
# ============================================================

defaults:
  email: you@example.com          # 各机场通用邮箱（不同的在机场里单独覆盖）
  password: "your-password"
  type: auto                      # auto=先试 v2board 失败回退 sspanel

accounts:

  # ---- 类型1：标准 v2board/SSPanel（账号密码即可）----
  some-airport-a: {}              # 用 defaults 的邮箱密码
  some-airport-b:
    email: other@example.com      # 这个机场用不同账号
    password: "another-password"
  some-sspanel:
    type: sspanel                 # 明确是 SSPanel 时可指定（不填也会 auto 回退）

  # ---- 类型2：反爬 / 有订阅链接（填 sub_url）----
  speedcat:
    sub_url: https://复制来的订阅链接?token=xxxx
  fastlink:
    sub_url: https://复制来的订阅链接

  # ---- 类型3：JS 弹窗节点页（填 cookie + base）----
  ayucloud:
    base: https://ayucloud.nl                       # 后台域名
    cookie: "uid=xxx; email=xxx; key=xxx; ..."      # F12 里复制的整段 Cookie
    # max_id: 300                                   # 遍历的最大节点ID，默认300，可不填

  # ---- 说明 ----
  # 优先级：sub_url > cookie > 账号密码。填了前者就用前者。
  # cookie/token 过期后，pull 会抓到 0 节点并告警，届时重新复制一次即可。
