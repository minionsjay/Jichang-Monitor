# 复制为 notify.yaml 后填自己的地址（notify.yaml 已在 .gitignore，不会入库）
#
# ── 通道一：企业微信群机器人（推荐，消息进「企业微信」App，能同步到微信）
#    群设置 → 群机器人 → 添加 → 复制 Webhook 地址
#    channels:
#      - type: wecom
#        url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx
#
# ── 通道二：Server酱 https://sct.ftqq.com/ （微信扫码，免费每天 5 条）
#    channels:
#      - type: serverchan
#        token: SCTxxxxx
#
# ── 通道三：PushPlus https://www.pushplus.plus/ （微信扫码，免费额度更宽）
#    channels:
#      - type: pushplus
#        token: xxxxxxxxxxxx
#
# ── 通道四：自定义 webhook（Bark / 飞书 / 钉钉 / n8n 都行，POST {"title","text","md"}）
#    channels:
#      - type: webhook
#        url: https://example.com/hook

enabled: true
huawei: true      # 华为云命中就推（默认开）
fronting: false   # 大厂域名前置不推（不是华为，噪音）
run_fail: false   # 整轮采集失败也推

# ── 通道五：复用 DSH-IM 已接入的机器人（微信/企微/飞书都行，推荐）
#    设置 → IM机器人 → 齿轮 → 复制 Bot ID；再「新建目标」→ 测试 → 保存 → 复制调用参数
#    把下面两行填上即可，url 留空会自动探测本机在跑的 DSH 端口
#      - type: dshim
#        bot_id: bot_9577c8572d454122a4ef7fb4d8420a91
#        target_id: airmon-alerts

channels:
  # 优先用 DSH-IM 里那个机器人：填上 bot_id / target_id 后把 type 改成 dshim
  - type: dshim
    bot_id: ""
    target_id: "airmon-alerts"
  - type: wecom
    url: ""
  - type: serverchan
    token: ""
  - type: pushplus
    token: ""
